name: Apply CI Patch

on:
  push:
    branches:
      - feature/openrouter-model-catalog-20260801
    paths:
      - .github/workflows/apply-ci-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feature/openrouter-model-catalog-20260801
      - name: Narrow regeneration user content
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/chat/job-command.ts')
          text = path.read_text()
          old = "  if (!userMessage || typeof userMessage.content !== 'string') throw new JobRuntimeError('JOB_INVALID_INPUT', 'Authoritative regeneration source is incomplete')\n  const cleanupObjectKeys"
          new = "  if (!userMessage || typeof userMessage.content !== 'string') throw new JobRuntimeError('JOB_INVALID_INPUT', 'Authoritative regeneration source is incomplete')\n  const userContent = userMessage.content\n  const cleanupObjectKeys"
          if old not in text:
              raise SystemExit('narrowing anchor missing')
          text = text.replace(old, new, 1).replace('      input_user_content: userMessage.content,', '      input_user_content: userContent,', 1)
          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/chat/job-command.ts
          git commit -m "Narrow regeneration message content"
          git push origin HEAD:feature/openrouter-model-catalog-20260801
