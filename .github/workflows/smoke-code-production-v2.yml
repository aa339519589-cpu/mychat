name: Smoke Code Production V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/smoke-code-production-v2.yml

permissions:
  contents: read
  statuses: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_URL: https://usibkqqksgwgvdiqwpyo.supabase.co
    steps:
      - name: Run isolated Code job
        env:
          GH_TOKEN: ${{ github.token }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          post_status() {
            jq -nc --arg state "$1" --arg context "Code Production Smoke V2" --arg description "${2:0:140}" --arg target_url "$RUN_URL" '{state:$state,context:$context,description:$description,target_url:$target_url}' | gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --input - >/dev/null
          }
          post_status pending "Reading production credentials"
          envs=''
          for attempt in {1..20}; do
            body="$(mktemp)"
            status="$(curl --silent --show-error --connect-timeout 10 --max-time 60 -H "Authorization: Bearer $RENDER_API_KEY" -o "$body" -w '%{http_code}' "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars?limit=100" || true)"
            if [[ "$status" == 200 ]]; then envs="$(cat "$body")"; rm -f "$body"; break; fi
            rm -f "$body"
            sleep 3
          done
          test -n "$envs"
          normalized="$(jq -c 'if type == "array" then map(.envVar // .) elif (.envVars | type) == "array" then (.envVars | map(.envVar // .)) else [] end' <<<"$envs")"
          service_role="$(jq -r 'map(select(.key == "SUPABASE_SERVICE_ROLE_KEY"))[0].value // empty' <<<"$normalized")"
          test -n "$service_role"
          auth=(-H "apikey: $service_role" -H "Authorization: Bearer $service_role" -H 'Content-Type: application/json')
          prefer=(-H 'Prefer: return=representation')
          users="$(curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors "${auth[@]}" "$SUPABASE_URL/auth/v1/admin/users?page=1&per_page=1000")"
          user_id="$(jq -r '.users[]? | select(.email == "339519589@qq.com") | .id' <<<"$users" | head -n1)"
          test -n "$user_id"
          session_id="$(cat /proc/sys/kernel/random/uuid)"; message_id="$(cat /proc/sys/kernel/random/uuid)"; response_id="$(cat /proc/sys/kernel/random/uuid)"; task_id="$(cat /proc/sys/kernel/random/uuid)"; job_id="$(cat /proc/sys/kernel/random/uuid)"
          repo="__mychat_new__/$session_id"; prompt='只回复“CODE_SMOKE_OK”，不要调用任何工具。'
          cleanup() { set +e; curl -sS -X DELETE "${auth[@]}" "$SUPABASE_URL/rest/v1/jobs?id=eq.$job_id" >/dev/null; curl -sS -X DELETE "${auth[@]}" "$SUPABASE_URL/rest/v1/agent_tasks?id=eq.$task_id" >/dev/null; curl -sS -X DELETE "${auth[@]}" "$SUPABASE_URL/rest/v1/code_messages?session_id=eq.$session_id" >/dev/null; curl -sS -X DELETE "${auth[@]}" "$SUPABASE_URL/rest/v1/code_sessions?id=eq.$session_id" >/dev/null; }
          trap cleanup EXIT
          curl --fail-with-body -sS --retry 5 --retry-all-errors -X POST "${auth[@]}" "${prefer[@]}" --data "$(jq -nc --arg id "$session_id" --arg user "$user_id" --arg repo "$repo" '{id:$id,user_id:$user,repo:$repo,title:"[system] Code smoke V2"}')" "$SUPABASE_URL/rest/v1/code_sessions" >/dev/null
          curl --fail-with-body -sS --retry 5 --retry-all-errors -X POST "${auth[@]}" "${prefer[@]}" --data "$(jq -nc --arg id "$message_id" --arg session "$session_id" --arg user "$user_id" --arg content "$prompt" '{id:$id,session_id:$session,user_id:$user,role:"user",content:$content,meta:null}')" "$SUPABASE_URL/rest/v1/code_messages" >/dev/null
          payload="$(jq -nc --arg repo "$repo" --arg session "$session_id" --arg response "$response_id" --arg message "$message_id" '{schemaVersion:1,repo:$repo,modelId:"deepseek-v4-flash",accessClass:"quota",reasoningEffort:"none",sessionId:$session,responseId:$response,userMessageId:$message,usingBalance:false}')"
          input_hash="$(printf '%s' "$payload" | sha256sum | cut -d' ' -f1)"
          rpc_body="$(jq -nc --arg user "$user_id" --arg task "$task_id" --arg goal "$prompt" --arg repo "$repo" --arg session "$session_id" --arg response "$response_id" --arg message "$message_id" --arg job "$job_id" --arg hash "$input_hash" --argjson payload "$payload" '{input_user_id:$user,input_task_id:$task,input_goal:$goal,input_repo:$repo,input_session_id:$session,input_response_id:$response,input_user_message_id:$message,input_job_id:$job,input_auth_class:"registered",input_idempotency_key:("smoke-v2:"+$task+":"+$response),input_input_hash:$hash,input_payload:$payload}')"
          enqueue="$(curl --fail-with-body -sS --retry 5 --retry-all-errors -X POST "${auth[@]}" "${prefer[@]}" --data "$rpc_body" "$SUPABASE_URL/rest/v1/rpc/enqueue_agent_task_job")"
          echo "SMOKE_ENQUEUE $(jq -c '.' <<<"$enqueue" | cut -c1-500)"
          final=''
          for attempt in {1..120}; do
            rows="$(curl --fail-with-body -sS --retry 3 --retry-all-errors "${auth[@]}" "$SUPABASE_URL/rest/v1/jobs?id=eq.$job_id&select=*")"
            status="$(jq -r '.[0].status // "missing"' <<<"$rows")"
            if [[ "$status" =~ ^(completed|failed|cancelled)$ ]]; then final="$rows"; break; fi
            sleep 3
          done
          test -n "$final"
          status="$(jq -r '.[0].status' <<<"$final")"; error_code="$(jq -r '.[0].error_code // "none"' <<<"$final")"
          events="$(curl --fail-with-body -sS --retry 3 --retry-all-errors "${auth[@]}" "$SUPABASE_URL/rest/v1/job_events?job_id=eq.$job_id&select=kind,payload&order=seq.asc")"
          result_text="$(jq -r 'map(select(.kind == "text.delta") | .payload.text // "") | join("")' <<<"$events")"
          compact="$(printf '%s' "$result_text" | tr '\r\n' ' ' | cut -c1-100)"
          echo "SMOKE_RESULT status=$status error=$error_code text=$compact"
          if [[ "$status" == completed && "$result_text" == *CODE_SMOKE_OK* ]]; then post_status success "Queue, worker, model and result stream completed"; exit 0; fi
          post_status failure "status=$status error=$error_code text=${compact:-empty}"
          exit 1
