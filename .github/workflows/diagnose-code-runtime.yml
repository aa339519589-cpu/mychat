name: Diagnose Code Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-code-runtime.yml

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://usibkqqksgwgvdiqwpyo.supabase.co
    steps:
      - name: Inspect production Code runtime
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -u
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          post_status() {
            jq -nc --arg state "$1" --arg context "$2" --arg description "${3:0:140}" --arg target_url "$run_url" \
              '{state:$state,context:$context,description:$description,target_url:$target_url}' \
              | gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --input - >/dev/null
          }
          post_status pending "Code Worker Diagnostic" "Reading production worker heartbeat"
          post_status pending "Code Job Diagnostic" "Reading recent Code jobs"
          post_status pending "Code Task Diagnostic" "Reading recent Code task failures"

          auth=(-H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")
          heartbeats="$(curl --fail-with-body --silent --show-error "${auth[@]}" \
            "$SUPABASE_URL/rest/v1/job_worker_heartbeats?select=revision,queues,capacity,draining,started_at,heartbeat_at,queue_capacities&order=heartbeat_at.desc&limit=8" 2>/dev/null)" || heartbeats='[]'
          jobs="$(curl --fail-with-body --silent --show-error "${auth[@]}" \
            "$SUPABASE_URL/rest/v1/jobs?type=eq.agent.task&select=status,attempt,max_attempts,error_code,error_class,created_at,updated_at,started_at,terminal_at,payload&order=created_at.desc&limit=20" 2>/dev/null)" || jobs='[]'
          tasks="$(curl --fail-with-body --silent --show-error "${auth[@]}" \
            "$SUPABASE_URL/rest/v1/agent_tasks?select=status,error,created_at,updated_at,started_at,finished_at&order=updated_at.desc&limit=10" 2>/dev/null)" || tasks='[]'
          runtime="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/MYCHAT_RUNTIME_ROLE" 2>/dev/null)" || runtime='{}'

          now="$(date +%s)"
          role="$(jq -r '.value // "missing"' <<<"$runtime" 2>/dev/null || echo invalid)"
          hb_at="$(jq -r '.[0].heartbeat_at // empty' <<<"$heartbeats" 2>/dev/null || true)"
          hb_age=999999
          if [[ -n "$hb_at" ]]; then hb_age=$(( now - $(date -d "$hb_at" +%s) )); fi
          hb_queues="$(jq -r '.[0].queues // [] | join(",")' <<<"$heartbeats" 2>/dev/null || echo invalid)"
          hb_draining="$(jq -r '.[0].draining // true' <<<"$heartbeats" 2>/dev/null || echo true)"
          worker_state=failure
          if [[ "$role" == "all" && "$hb_age" -le 30 && "$hb_queues" == *agent* && "$hb_draining" == "false" ]]; then worker_state=success; fi
          post_status "$worker_state" "Code Worker Diagnostic" "role=$role hb=${hb_age}s queues=${hb_queues:-none} draining=$hb_draining"

          job_status="$(jq -r '.[0].status // "none"' <<<"$jobs" 2>/dev/null || echo invalid)"
          job_model="$(jq -r '.[0].payload.modelId // "none"' <<<"$jobs" 2>/dev/null || echo invalid)"
          job_error="$(jq -r '.[0].error_code // "none"' <<<"$jobs" 2>/dev/null || echo invalid)"
          job_attempt="$(jq -r '.[0].attempt // 0' <<<"$jobs" 2>/dev/null || echo 0)"
          case "$job_status" in completed) job_state=success;; failed|cancelled|invalid|none) job_state=failure;; *) job_state=pending;; esac
          post_status "$job_state" "Code Job Diagnostic" "status=$job_status model=$job_model error=$job_error attempt=$job_attempt"

          task_status="$(jq -r '.[0].status // "none"' <<<"$tasks" 2>/dev/null || echo invalid)"
          task_error="$(jq -r '.[0].error // "none" | gsub("[\\r\\n]+";" ") | .[0:95]' <<<"$tasks" 2>/dev/null || echo diagnostic-query-failed)"
          case "$task_status" in completed|waiting_for_user|published) task_state=success;; failed|invalid|none) task_state=failure;; *) task_state=pending;; esac
          post_status "$task_state" "Code Task Diagnostic" "status=$task_status error=$task_error"
