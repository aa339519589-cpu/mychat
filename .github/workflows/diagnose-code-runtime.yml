name: Diagnose Code Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-code-runtime.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://usibkqqksgwgvdiqwpyo.supabase.co
    steps:
      - name: Inspect sanitized production runtime state
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          auth=(-H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")

          echo '=== worker heartbeats ==='
          curl --fail-with-body --silent --show-error "${auth[@]}" \
            "$SUPABASE_URL/rest/v1/job_worker_heartbeats?select=worker_id,revision,queues,capacity,draining,started_at,heartbeat_at,queue_capacities&order=heartbeat_at.desc&limit=8" \
            | jq 'map({worker_id,revision,queues,capacity,draining,started_at,heartbeat_at,queue_capacities})'

          echo '=== recent agent jobs ==='
          jobs="$(curl --fail-with-body --silent --show-error "${auth[@]}" \
            "$SUPABASE_URL/rest/v1/jobs?type=eq.agent.task&select=id,status,attempt,max_attempts,error_code,error_class,created_at,updated_at,started_at,terminal_at,payload&order=created_at.desc&limit=20")"
          jq 'map({id,status,attempt,max_attempts,error_code,error_class,created_at,updated_at,started_at,terminal_at,modelId:(.payload.modelId // null),accessClass:(.payload.accessClass // null),reasoningEffort:(.payload.reasoningEffort // null)})' <<<"$jobs"

          ids="$(jq -r 'map(.id) | join(",")' <<<"$jobs")"
          if [[ -n "$ids" ]]; then
            encoded="$(jq -rn --arg value "in.($ids)" '$value|@uri')"
            echo '=== recent agent events ==='
            curl --fail-with-body --silent --show-error "${auth[@]}" \
              "$SUPABASE_URL/rest/v1/job_events?job_id=$encoded&select=job_id,seq,kind,payload,created_at&order=created_at.desc&limit=80" \
              | jq 'map({job_id,seq,kind,created_at,errorCode:(.payload.errorCode // null),status:(.payload.status // null),textLength:((.payload.text // "")|length)})'
          fi

          echo '=== Render runtime role ==='
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/MYCHAT_RUNTIME_ROLE" \
            | jq '{runtime_role:(.value // null)}'
