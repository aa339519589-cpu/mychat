name: Diagnose Code Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-code-runtime.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://usibkqqksgwgvdiqwpyo.supabase.co
    steps:
      - uses: actions/checkout@v4
      - name: Capture sanitized production runtime state
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          auth=(-H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")

          heartbeats="$(curl --fail-with-body --silent --show-error "${auth[@]}" \
            "$SUPABASE_URL/rest/v1/job_worker_heartbeats?select=revision,queues,capacity,draining,started_at,heartbeat_at,queue_capacities&order=heartbeat_at.desc&limit=8")"

          jobs="$(curl --fail-with-body --silent --show-error "${auth[@]}" \
            "$SUPABASE_URL/rest/v1/jobs?type=eq.agent.task&select=id,status,attempt,max_attempts,error_code,error_class,created_at,updated_at,started_at,terminal_at,payload&order=created_at.desc&limit=30")"

          ids="$(jq -r 'map(.id) | join(",")' <<<"$jobs")"
          events='[]'
          if [[ -n "$ids" ]]; then
            encoded="$(jq -rn --arg value "in.($ids)" '$value|@uri')"
            events="$(curl --fail-with-body --silent --show-error "${auth[@]}" \
              "$SUPABASE_URL/rest/v1/job_events?job_id=$encoded&select=kind,payload,created_at&order=created_at.desc&limit=120")"
          fi

          runtime="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/MYCHAT_RUNTIME_ROLE")"

          mkdir -p .diagnostics
          jq -n \
            --arg generatedAt "$(date -u +%FT%TZ)" \
            --argjson heartbeats "$heartbeats" \
            --argjson jobs "$jobs" \
            --argjson events "$events" \
            --argjson runtime "$runtime" \
            '{
              generatedAt: $generatedAt,
              runtimeRole: ($runtime.value // null),
              heartbeats: ($heartbeats | map({revision,queues,capacity,draining,started_at,heartbeat_at,queue_capacities})),
              jobs: ($jobs | map({status,attempt,max_attempts,error_code,error_class,created_at,updated_at,started_at,terminal_at,modelId:(.payload.modelId // null),accessClass:(.payload.accessClass // null),reasoningEffort:(.payload.reasoningEffort // null)})),
              eventSummary: ($events | group_by([.kind, (.payload.errorCode // null), (.payload.status // null)]) | map({kind:.[0].kind,errorCode:(.[0].payload.errorCode // null),status:(.[0].payload.status // null),count:length,latest:(map(.created_at)|max)}))
            }' > .diagnostics/code-runtime.json

      - name: Commit diagnostic result
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .diagnostics/code-runtime.json
          git diff --cached --quiet && exit 0
          git commit -m "Record sanitized Code runtime diagnostics"
          git push
