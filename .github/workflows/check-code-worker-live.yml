name: Check Code Worker Live

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-code-worker-live.yml

permissions:
  contents: read
  statuses: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://usibkqqksgwgvdiqwpyo.supabase.co
    steps:
      - name: Read live worker state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          env_base="https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars"
          service_role="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $RENDER_API_KEY" "$env_base/SUPABASE_SERVICE_ROLE_KEY" | jq -r '.value // empty')"
          auth=(-H "apikey: $service_role" -H "Authorization: Bearer $service_role")
          heartbeats="$(curl --fail-with-body --silent --show-error "${auth[@]}" \
            "$SUPABASE_URL/rest/v1/job_worker_heartbeats?select=revision,queues,draining,heartbeat_at&order=heartbeat_at.desc&limit=5")"
          jobs="$(curl --fail-with-body --silent --show-error "${auth[@]}" \
            "$SUPABASE_URL/rest/v1/jobs?type=eq.agent.task&select=status,error_code,attempt,payload,created_at&order=created_at.desc&limit=5")"
          revision="$(jq -r '.[0].revision // "none"' <<<"$heartbeats")"
          queues="$(jq -r '.[0].queues // [] | join(",")' <<<"$heartbeats")"
          draining="$(jq -r '.[0].draining // true' <<<"$heartbeats")"
          heartbeat_at="$(jq -r '.[0].heartbeat_at // "none"' <<<"$heartbeats")"
          job="$(jq -r '.[0] | if . then "status=\(.status) model=\(.payload.modelId // \"none\") error=\(.error_code // \"none\") attempt=\(.attempt)" else "none" end' <<<"$jobs")"
          echo "LIVE_CODE_WORKER revision=$revision queues=$queues draining=$draining heartbeat=$heartbeat_at"
          echo "LIVE_CODE_JOB $job"
          state=failure
          if [[ "$revision" != "none" && "$queues" == *agent* && "$draining" == "false" ]]; then state=success; fi
          description="revision=$revision queues=${queues:-none} draining=$draining heartbeat=$heartbeat_at"
          jq -nc --arg state "$state" --arg context "Live Code Worker" --arg description "${description:0:140}" --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --input - >/dev/null
