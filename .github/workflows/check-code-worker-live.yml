name: Check Code Worker Live
# Retry post-deploy worker verification.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-code-worker-live.yml

permissions:
  contents: read
  statuses: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://usibkqqksgwgvdiqwpyo.supabase.co
    steps:
      - name: Read live worker state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          post_status() {
            jq -nc --arg state "$1" --arg context "Live Code Worker" --arg description "${2:0:140}" --arg target_url "$RUN_URL" \
              '{state:$state,context:$context,description:$description,target_url:$target_url}' \
              | gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --input - >/dev/null
          }
          post_status pending "Reading live Code worker heartbeat"
          env_base="https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars"
          service_role=''
          for attempt in {1..12}; do
            response="$(curl --silent --show-error --retry 3 --retry-all-errors \
              -H "Authorization: Bearer $RENDER_API_KEY" "$env_base/SUPABASE_SERVICE_ROLE_KEY" 2>/dev/null)" || response='{}'
            service_role="$(jq -r '.value // empty' <<<"$response" 2>/dev/null || true)"
            [[ -n "$service_role" ]] && break
            sleep 3
          done
          if [[ -z "$service_role" ]]; then
            echo 'LIVE_CODE_WORKER verification-key-unavailable'
            post_status failure "Render environment verification key unavailable"
            exit 0
          fi
          auth=(-H "apikey: $service_role" -H "Authorization: Bearer $service_role")
          heartbeats='[]'
          jobs='[]'
          for attempt in {1..12}; do
            heartbeats="$(curl --silent --show-error --retry 3 --retry-all-errors "${auth[@]}" \
              "$SUPABASE_URL/rest/v1/job_worker_heartbeats?select=revision,queues,draining,heartbeat_at&order=heartbeat_at.desc&limit=5" 2>/dev/null)" || heartbeats='[]'
            if jq -e 'type == "array"' <<<"$heartbeats" >/dev/null 2>&1; then break; fi
            heartbeats='[]'
            sleep 3
          done
          jobs="$(curl --silent --show-error --retry 3 --retry-all-errors "${auth[@]}" \
            "$SUPABASE_URL/rest/v1/jobs?type=eq.agent.task&select=status,error_code,attempt,payload,created_at&order=created_at.desc&limit=5" 2>/dev/null)" || jobs='[]'
          revision="$(jq -r '.[0].revision // "none"' <<<"$heartbeats" 2>/dev/null || echo invalid)"
          queues="$(jq -r '.[0].queues // [] | join(",")' <<<"$heartbeats" 2>/dev/null || echo invalid)"
          draining="$(jq -r '.[0].draining // true' <<<"$heartbeats" 2>/dev/null || echo true)"
          heartbeat_at="$(jq -r '.[0].heartbeat_at // "none"' <<<"$heartbeats" 2>/dev/null || echo invalid)"
          job="$(jq -r '.[0] | if . then "status=\(.status) model=\(.payload.modelId // \"none\") error=\(.error_code // \"none\") attempt=\(.attempt)" else "none" end' <<<"$jobs" 2>/dev/null || echo invalid)"
          echo "LIVE_CODE_WORKER revision=$revision queues=$queues draining=$draining heartbeat=$heartbeat_at"
          echo "LIVE_CODE_JOB $job"
          state=failure
          if [[ "$revision" != "none" && "$revision" != "invalid" && "$queues" == *agent* && "$draining" == "false" ]]; then state=success; fi
          post_status "$state" "revision=$revision queues=${queues:-none} draining=$draining heartbeat=$heartbeat_at"
