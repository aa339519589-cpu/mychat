name: Check Code Worker Live
# Read focused Render logs for worker heartbeat and Agent startup failures.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-code-worker-live.yml

permissions:
  contents: read
  statuses: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read focused production worker logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          post_status() {
            jq -nc --arg state "$1" --arg context "Live Code Worker" --arg description "${2:0:140}" --arg target_url "$RUN_URL" \
              '{state:$state,context:$context,description:$description,target_url:$target_url}' \
              | gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --input - >/dev/null
          }
          post_status pending "Reading worker heartbeat and Agent logs"
          auth=(-H "Authorization: Bearer $RENDER_API_KEY")
          service="$(curl --fail-with-body --silent --show-error --retry 4 --retry-all-errors \
            "${auth[@]}" "https://api.render.com/v1/services/$RENDER_SERVICE_ID")"
          owner="$(jq -r '.ownerId // .owner.id // empty' <<<"$service")"
          test -n "$owner"
          read_logs() {
            curl --fail-with-body --silent --show-error --retry 4 --retry-all-errors --get \
              "${auth[@]}" 'https://api.render.com/v1/logs' \
              --data-urlencode "ownerId=$owner" \
              --data-urlencode "resource=$RENDER_SERVICE_ID" \
              --data-urlencode 'type=app' \
              --data-urlencode 'direction=backward' \
              --data-urlencode "text=$1" \
              --data-urlencode 'limit=100'
          }
          heartbeat_logs="$(read_logs '*heartbeat*')"
          agent_logs="$(read_logs '*Agent*')"
          production_logs="$(read_logs '*production*')"
          extract() { jq -r '(.logs // .)[]? | (.message // .text // .log // empty)' ; }
          echo '=== HEARTBEAT LOGS ==='
          heartbeat_messages="$(extract <<<"$heartbeat_logs")"
          echo "$heartbeat_messages" | head -n 80
          echo '=== AGENT LOGS ==='
          agent_messages="$(extract <<<"$agent_logs")"
          echo "$agent_messages" | head -n 80
          echo '=== SUPERVISOR LOGS ==='
          production_messages="$(extract <<<"$production_logs")"
          echo "$production_messages" | head -n 80
          recent="$(printf '%s\n%s\n%s\n' "$heartbeat_messages" "$agent_messages" "$production_messages" | grep -Ei 'failed|error|exited|rejected|unavailable|invalid' | head -n 1 | tr '\r\n' ' ' | cut -c1-120)"
          post_status failure "${recent:-Worker started; heartbeat failure detail not found}"
