name: Check Code Worker Live
# Read Render application logs for the production supervisor and worker.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-code-worker-live.yml

permissions:
  contents: read
  statuses: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read production runtime logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          post_status() {
            jq -nc --arg state "$1" --arg context "Live Code Worker" --arg description "${2:0:140}" --arg target_url "$RUN_URL" \
              '{state:$state,context:$context,description:$description,target_url:$target_url}' \
              | gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --input - >/dev/null
          }
          post_status pending "Reading Render supervisor and worker logs"
          auth=(-H "Authorization: Bearer $RENDER_API_KEY")
          service="$(curl --fail-with-body --silent --show-error --retry 4 --retry-all-errors \
            "${auth[@]}" "https://api.render.com/v1/services/$RENDER_SERVICE_ID")"
          owner="$(jq -r '.ownerId // .owner.id // empty' <<<"$service")"
          start_command="$(jq -r '.serviceDetails.envSpecificDetails.startCommand // "missing"' <<<"$service")"
          test -n "$owner"
          logs="$(curl --fail-with-body --silent --show-error --retry 4 --retry-all-errors --get \
            "${auth[@]}" 'https://api.render.com/v1/logs' \
            --data-urlencode "ownerId=$owner" \
            --data-urlencode "resource=$RENDER_SERVICE_ID" \
            --data-urlencode 'type=app' \
            --data-urlencode 'direction=backward' \
            --data-urlencode 'limit=100')"
          messages="$(jq -r '
            (.logs // .)[]?
            | (.message // .text // .log // empty)
          ' <<<"$logs")"
          echo "RENDER_START_COMMAND $start_command"
          echo "$messages" | grep -Ei 'production|worker|jobs|runtime|sandbox|credential|deepseek|supabase|failed|error|invalid' | head -n 80 || true
          recent="$(echo "$messages" | grep -Ei 'production|worker|jobs|runtime|sandbox|credential|deepseek|supabase|failed|error|invalid' | head -n 1 | tr '\r\n' ' ' | cut -c1-120)"
          post_status failure "start=$start_command log=${recent:-no worker log found}"
