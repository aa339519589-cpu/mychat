name: Temporary read-only MyChat Memory database diagnosis

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-memory-db-temporary.yml

permissions: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - name: Probe production schema without reading records
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RENDER_API_KEY"
          test -n "$RENDER_SERVICE_ID"
          render_env=$(curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars?limit=100")
          normalized=$(jq -c 'if type == "array" then map(.envVar // .) elif (.envVars | type) == "array" then (.envVars | map(.envVar // .)) else [] end' <<<"$render_env")
          service_role=$(jq -r 'map(select(.key == "SUPABASE_SERVICE_ROLE_KEY"))[0].value // empty' <<<"$normalized")
          supabase_url=$(jq -r 'map(select(.key == "NEXT_PUBLIC_SUPABASE_URL" or .key == "SUPABASE_URL"))[0].value // empty' <<<"$normalized")
          test -n "$service_role"
          test -n "$supabase_url"
          echo "::add-mask::$service_role"
          echo "production_env_keys=$(jq -r 'map(.key) | sort | join(",")' <<<"$normalized")"
          auth=(-H "apikey: $service_role" -H "Authorization: Bearer $service_role" -H 'Accept: application/json')
          probe() {
            local table="$1" columns="$2" body status code message
            body=$(mktemp)
            status=$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
              "${auth[@]}" --output "$body" --write-out '%{http_code}' \
              "$supabase_url/rest/v1/$table?select=$columns&limit=0")
            if [[ "$status" == 2* ]]; then
              echo "$table status=$status visible=true no_rows_requested=true"
            else
              code=$(jq -r '.code // ""' "$body" 2>/dev/null || true)
              message=$(jq -r '.message // ""' "$body" 2>/dev/null | cut -c1-180 || true)
              echo "$table status=$status code=$code message=$message"
            fi
            rm -f "$body"
          }
          probe memories id
          probe profiles user_id
          probe project_memories id
          probe code_memories id
          probe profits id
          body=$(mktemp)
          status=$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
            "${auth[@]}" -H 'Content-Type: application/json' \
            --output "$body" --write-out '%{http_code}' \
            --request POST \
            --data '{"input_contract_version":5,"input_manifest_sha256":"69e4973cfac2b9532f27b784257df991e09796c1bdf8a6872297806de0db4d74","input_migration_count":51}' \
            "$supabase_url/rest/v1/rpc/verify_schema_contract_v3")
          if [[ "$status" == 2* ]]; then
            echo "schema_contract_v5 status=$status result=$(jq -c '.' "$body")"
          else
            echo "schema_contract_v5 status=$status code=$(jq -r '.code // ""' "$body" 2>/dev/null || true) message=$(jq -r '.message // ""' "$body" 2>/dev/null | cut -c1-180 || true)"
          fi
          rm -f "$body"
