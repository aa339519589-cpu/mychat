name: Temporary read-only MyChat Memory database diagnosis

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-memory-db-temporary.yml

permissions: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SUPABASE_PROJECT_REF: usibkqqksgwgvdiqwpyo
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Read database catalog metadata only
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          query=$(cat <<'SQL'
          select jsonb_build_object(
            'profit_relations', coalesce((
              select jsonb_agg(jsonb_build_object(
                'schema', n.nspname,
                'name', c.relname,
                'kind', c.relkind,
                'owner', pg_get_userbyid(c.relowner),
                'rls', c.relrowsecurity,
                'force_rls', c.relforcerowsecurity,
                'anon_select', has_table_privilege('anon', c.oid, 'select'),
                'authenticated_select', has_table_privilege('authenticated', c.oid, 'select'),
                'service_role_select', has_table_privilege('service_role', c.oid, 'select')
              ) order by n.nspname, c.relname)
              from pg_class c
              join pg_namespace n on n.oid = c.relnamespace
              where c.relname ilike '%profit%'
                and c.relkind in ('r','p','v','m','f')
                and n.nspname not in ('pg_catalog','information_schema')
            ), '[]'::jsonb),
            'memory_relations', coalesce((
              select jsonb_agg(jsonb_build_object(
                'schema', n.nspname,
                'name', c.relname,
                'kind', c.relkind,
                'rls', c.relrowsecurity,
                'force_rls', c.relforcerowsecurity,
                'authenticated_select', has_table_privilege('authenticated', c.oid, 'select'),
                'authenticated_insert', has_table_privilege('authenticated', c.oid, 'insert'),
                'authenticated_update', has_table_privilege('authenticated', c.oid, 'update'),
                'authenticated_delete', has_table_privilege('authenticated', c.oid, 'delete')
              ) order by c.relname)
              from pg_class c
              join pg_namespace n on n.oid = c.relnamespace
              where n.nspname = 'public'
                and c.relname in ('memories','project_memories','code_memories','profiles')
                and c.relkind in ('r','p','v','m','f')
            ), '[]'::jsonb),
            'relevant_policies', coalesce((
              select jsonb_agg(jsonb_build_object(
                'schema', schemaname,
                'table', tablename,
                'name', policyname,
                'roles', roles,
                'command', cmd,
                'using', qual,
                'check', with_check
              ) order by schemaname, tablename, policyname)
              from pg_policies
              where (schemaname = 'public'
                and tablename in ('memories','project_memories','code_memories','profiles'))
                or coalesce(qual,'') ilike '%profit%'
                or coalesce(with_check,'') ilike '%profit%'
            ), '[]'::jsonb),
            'functions_referencing_profit', coalesce((
              select jsonb_agg(jsonb_build_object(
                'schema', n.nspname,
                'name', p.proname,
                'kind', p.prokind,
                'security_definer', p.prosecdef
              ) order by n.nspname, p.proname)
              from pg_proc p
              join pg_namespace n on n.oid = p.pronamespace
              where n.nspname not in ('pg_catalog','information_schema')
                and p.prokind in ('f','p','w')
                and pg_get_functiondef(p.oid) ilike '%profit%'
            ), '[]'::jsonb),
            'views_referencing_profit', coalesce((
              select jsonb_agg(jsonb_build_object(
                'schema', schemaname,
                'name', viewname,
                'owner', viewowner
              ) order by schemaname, viewname)
              from pg_views
              where definition ilike '%profit%'
                and schemaname not in ('pg_catalog','information_schema')
            ), '[]'::jsonb),
            'memory_triggers', coalesce((
              select jsonb_agg(jsonb_build_object(
                'table', c.relname,
                'trigger', t.tgname,
                'enabled', t.tgenabled,
                'function_schema', fn.nspname,
                'function', p.proname
              ) order by c.relname, t.tgname)
              from pg_trigger t
              join pg_class c on c.oid = t.tgrelid
              join pg_namespace n on n.oid = c.relnamespace
              join pg_proc p on p.oid = t.tgfoid
              join pg_namespace fn on fn.oid = p.pronamespace
              where not t.tgisinternal
                and n.nspname = 'public'
                and c.relname in ('memories','project_memories','code_memories','profiles')
            ), '[]'::jsonb)
          ) as diagnosis;
          SQL
          )
          result=$(curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 60 \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$(jq -nc --arg query "$query" '{query:$query,read_only:true}')" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query")
          jq -c '.' <<<"$result"
