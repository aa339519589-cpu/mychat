name: Deploy Exact Render Revision

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-exact-render-revision.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  PRODUCTION_URL: https://mychat-nm6x.onrender.com
  # Deployment trigger for Code model return repair.

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REVISION: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configure runtime identity, deploy, and prove production
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="initializing"

          report() {
            curl --silent --show-error --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data "$(jq -nc --arg state "$1" --arg context "$2" --arg description "$3" --arg target_url "$PRODUCTION_URL" '{state:$state,context:$context,description:$description,target_url:$target_url}')" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$REVISION" >/dev/null || true
          }

          fail() {
            local code=$?
            trap - ERR
            report failure "Exact Render Deploy: $stage" "Exact deployment failed at $stage"
            exit "$code"
          }
          trap fail ERR

          matches_revision() {
            local candidate="$1"
            [[ -n "$candidate" ]] && { [[ "${REVISION:0:${#candidate}}" == "$candidate" ]] || [[ "${candidate:0:${#REVISION}}" == "$REVISION" ]]; }
          }

          render_get() {
            curl --fail-with-body --silent --show-error \
              --retry 4 --retry-all-errors --connect-timeout 10 --max-time 60 \
              --header "Authorization: Bearer $RENDER_API_KEY" "$1"
          }

          stage="identity"
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REVISION"
          test -n "$OPENROUTER_API_KEY"
          test -n "$RENDER_API_KEY"
          [[ "$RENDER_SERVICE_ID" =~ ^srv-[a-z0-9]+$ ]]

          stage="render-environment"
          report pending "Exact Render Production" "Setting exact runtime identity and deploying"
          for entry in "OPENROUTER_API_KEY=$OPENROUTER_API_KEY" "MYCHAT_BUILD_REVISION=$REVISION"; do
            key="${entry%%=*}"
            value="${entry#*=}"
            curl --fail-with-body --silent --show-error \
              --retry 4 --retry-all-errors --connect-timeout 10 --max-time 60 \
              --request PUT \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              --header 'Content-Type: application/json' \
              --data "$(jq -nc --arg value "$value" '{value:$value}')" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/$key" >/dev/null
          done

          stage="render-start"
          http_code="$(curl --silent --show-error --retry 3 --retry-all-errors --connect-timeout 10 --max-time 60 \
            --request POST \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header 'Content-Type: application/json' \
            --data "$(jq -nc --arg commitId "$REVISION" '{commitId:$commitId}')" \
            --output /tmp/render-start.json \
            --write-out '%{http_code}' \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" || true)"

          deploy_id=""
          if [[ "$http_code" =~ ^2[0-9][0-9]$ ]] && jq -e . /tmp/render-start.json >/dev/null 2>&1; then
            deploy_id="$(jq -r '.id // .deploy.id // .[0].id // .[0].deploy.id // empty' /tmp/render-start.json)"
          fi

          stage="render-resolve"
          if [[ -z "$deploy_id" ]]; then
            for attempt in {1..120}; do
              list="$(render_get "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=50")"
              deploy_id="$(jq -r --arg rev "$REVISION" '
                def rows: if type == "array" then .[] elif type == "object" and (.deploys | type) == "array" then .deploys[] else empty end;
                [rows | (.deploy // .) | (.commit.id // .commitId // "") as $commit |
                  select($commit != "" and (($commit == $rev) or ($rev | startswith($commit)) or ($commit | startswith($rev))))
                ] | first | .id // empty
              ' <<<"$list")"
              [[ -n "$deploy_id" ]] && break
              sleep 5
            done
          fi
          test -n "$deploy_id"

          stage="render-wait-live"
          status=""
          for attempt in {1..180}; do
            response="$(render_get "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$deploy_id")"
            status="$(jq -r '.status // .deploy.status // .[0].status // .[0].deploy.status // empty' <<<"$response")"
            commit_id="$(jq -r '.commit.id // .deploy.commit.id // .commitId // .[0].commit.id // .[0].deploy.commit.id // empty' <<<"$response")"
            [[ -z "$commit_id" ]] || matches_revision "$commit_id"
            case "$status" in
              live) break ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated) false ;;
            esac
            sleep 10
          done
          [[ "$status" == "live" ]]

          stage="render-verify-revision"
          runtime_revision=""
          for attempt in {1..60}; do
            payload="$(curl --fail-with-body --silent --show-error --retry 2 --retry-all-errors --connect-timeout 10 --max-time 60 --header 'Accept: application/json' "$PRODUCTION_URL/api/ready" || true)"
            runtime_revision="$(jq -r '.revision // empty' <<<"$payload" 2>/dev/null || true)"
            matches_revision "$runtime_revision" && break
            sleep 5
          done
          matches_revision "$runtime_revision"
          report success "Exact Render Production" "Live exact revision ${REVISION:0:12}"
          report success "Exact Production Closure" "Production is live on exact verified revision"
