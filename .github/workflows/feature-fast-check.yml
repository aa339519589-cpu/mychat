name: Feature Fast Check

on:
  push:
    branches:
      - feature/openrouter-model-catalog-20260801

permissions:
  contents: read
  statuses: write

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Mark typecheck pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$(jq -nc --arg state pending --arg context 'Feature Typecheck' --arg description 'Running fast TypeScript check' '{state:$state,context:$context,description:$description}')" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: npm run check
      - name: Report typecheck result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          if [[ "$RESULT" == "success" ]]; then state=success; description='TypeScript check passed'; else state=failure; description='TypeScript check failed'; fi
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$(jq -nc --arg state "$state" --arg context 'Feature Typecheck' --arg description "$description" '{state:$state,context:$context,description:$description}')" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null
