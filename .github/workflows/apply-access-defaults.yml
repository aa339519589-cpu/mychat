name: Apply Access Defaults

on:
  push:
    branches:
      - feature/openrouter-model-catalog-20260801
    paths:
      - .github/workflows/apply-access-defaults.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feature/openrouter-model-catalog-20260801
      - name: Apply compatibility defaults
        run: |
          python - <<'PY'
          from pathlib import Path

          job = Path('lib/chat/job-command.ts')
          text = job.read_text()
          replacements = {
            "    accessClass: input.accessClass,": "    accessClass: input.accessClass ?? 'legacy',",
            "tokenLimit: input.accessClass === 'trial' ? 30_000 : 160_000": "tokenLimit: (input.accessClass ?? 'legacy') === 'trial' ? 30_000 : 160_000",
          }
          for old, new in replacements.items():
            if old not in text:
              raise SystemExit(f'missing job-command anchor: {old}')
            text = text.replace(old, new, 1)
          job.write_text(text)

          handler = Path('lib/jobs/handlers/chat-input.ts')
          text = handler.read_text()
          old = "function accessClass(value: unknown): ModelAccessClass | 'legacy' {\n  if (value === 'quota' || value === 'trial' || value === 'premium' || value === 'legacy') return value"
          new = "function accessClass(value: unknown): ModelAccessClass | 'legacy' {\n  if (value === undefined) return 'legacy'\n  if (value === 'quota' || value === 'trial' || value === 'premium' || value === 'legacy') return value"
          if old not in text:
            raise SystemExit('missing chat-input access anchor')
          handler.write_text(text.replace(old, new, 1))
          PY
      - name: Commit compatibility patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/chat/job-command.ts lib/jobs/handlers/chat-input.ts
          git commit -m "Default legacy model access for old call sites"
          git push origin HEAD:feature/openrouter-model-catalog-20260801
