name: Force Render Web Deploy

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/force-render-web-deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  PRODUCTION_URL: https://mychat-nm6x.onrender.com

jobs:
  deploy:
    name: Deploy exact Matrix web revision
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REVISION: ${{ github.sha }}
    steps:
      - name: Report Render deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "DEPLOY_STAGE=initializing" >> "$GITHUB_ENV"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$(jq -nc --arg state pending --arg context 'Render Production' --arg description 'Deploying exact Matrix web revision' '{state:$state,context:$context,description:$description}')" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$REVISION"

      - name: Validate Render credentials
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "DEPLOY_STAGE=validating credentials" >> "$GITHUB_ENV"
          test -n "$RENDER_API_KEY"
          [[ "$RENDER_SERVICE_ID" =~ ^srv-[a-z0-9]+$ ]]
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]

      - name: Start exact revision deploy
        id: render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "DEPLOY_STAGE=starting Render deploy" >> "$GITHUB_ENV"
          http_code=000
          for attempt in {1..20}; do
            set +e
            http_code="$(curl --silent --show-error \
              --connect-timeout 10 --max-time 60 \
              --request POST \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              --header 'Content-Type: application/json' \
              --data "$(jq -nc --arg commitId "$REVISION" '{commitId: $commitId}')" \
              --output /tmp/render-start.json \
              --write-out '%{http_code}' \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")"
            curl_status=$?
            set -e
            if [[ $curl_status -eq 0 && "$http_code" =~ ^2[0-9][0-9]$ ]]; then
              break
            fi
            echo "Render deploy start attempt $attempt returned HTTP $http_code" >&2
            cat /tmp/render-start.json >&2 2>/dev/null || true
            sleep 15
          done
          [[ "$http_code" =~ ^2[0-9][0-9]$ ]]
          response="$(cat /tmp/render-start.json)"
          deploy_id="$(jq -er '.id' <<<"$response")"
          commit_id="$(jq -r '.commit.id // empty' <<<"$response")"
          [[ "$deploy_id" =~ ^dep-[a-z0-9]+$ ]]
          if [[ -n "$commit_id" && "$commit_id" != "$REVISION" ]]; then
            echo "Render selected $commit_id instead of $REVISION" >&2
            exit 1
          fi
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DEPLOY_ID: ${{ steps.render.outputs.deploy_id }}
        run: |
          echo "DEPLOY_STAGE=waiting for Render live" >> "$GITHUB_ENV"
          for attempt in {1..180}; do
            response="$(curl --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors --connect-timeout 10 --max-time 60 \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID")"
            status="$(jq -er '.status' <<<"$response")"
            commit_id="$(jq -r '.commit.id // empty' <<<"$response")"
            if [[ -n "$commit_id" && "$commit_id" != "$REVISION" ]]; then
              echo "Render deploy changed revision to $commit_id" >&2
              exit 1
            fi
            case "$status" in
              live) exit 0 ;;
              build_failed|update_failed|canceled|deactivated) echo "Render deploy failed: $status" >&2; exit 1 ;;
            esac
            sleep 10
          done
          echo "Render deploy timed out" >&2
          exit 1

      - name: Confirm production revision
        run: |
          echo "DEPLOY_STAGE=verifying production revision" >> "$GITHUB_ENV"
          for attempt in {1..30}; do
            payload="$(curl --fail-with-body --silent --show-error \
              --retry 2 --retry-all-errors --connect-timeout 10 --max-time 60 \
              --header 'Accept: application/json' \
              "$PRODUCTION_URL/api/ready" || true)"
            runtime_revision="$(jq -r '.revision // empty' <<<"$payload" 2>/dev/null || true)"
            if [[ -n "$runtime_revision" && "${REVISION:0:${#runtime_revision}}" == "$runtime_revision" ]]; then
              echo "Production is serving revision $runtime_revision"
              exit 0
            fi
            sleep 5
          done
          echo "Production did not report the requested revision" >&2
          exit 1

      - name: Report Render deployment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ "$JOB_STATUS" == "success" ]]; then
            state=success
            description="Render live; exact revision ${REVISION:0:12} verified"
          else
            state=failure
            description="Render failed at ${DEPLOY_STAGE:-unknown} for ${REVISION:0:12}"
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$(jq -nc --arg state "$state" --arg context 'Render Production' --arg description "$description" --arg target_url "$PRODUCTION_URL" '{state:$state,context:$context,description:$description,target_url:$target_url}')" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$REVISION"
