name: Force Render Web Deploy

# Production closure trigger: model picker, formulas, provider icons, and scroll bubble.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/force-render-web-deploy.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  statuses: write

env:
  PRODUCTION_URL: https://mychat-nm6x.onrender.com
  SUPABASE_PROJECT_REF: usibkqqksgwgvdiqwpyo

jobs:
  deploy:
    name: Migrate and deploy exact Matrix revision
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REVISION: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify, migrate, deploy, and prove production
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="initializing"

          report() {
            local state="$1" context="$2" description="$3"
            curl --silent --show-error --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data "$(jq -nc --arg state "$state" --arg context "$context" --arg description "$description" --arg target_url "$PRODUCTION_URL" '{state:$state,context:$context,description:$description,target_url:$target_url}')" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$REVISION" >/dev/null || true
          }

          fail() {
            local code=$?
            trap - ERR
            report failure "Production Closure: $stage" "Production closure failed at $stage"
            case "$stage" in
              verify-gates) report failure "Main Verification" "Verify or Security did not pass" ;;
              supabase-credentials) report failure "Supabase Migration" "SUPABASE_ACCESS_TOKEN is missing" ;;
              supabase-*) report failure "Supabase Migration" "Database migration failed at $stage" ;;
              render-openrouter-*) report failure "Render Production" "OpenRouter credential failed at $stage" ;;
              *) report failure "Render Production" "Render failed at $stage for ${REVISION:0:12}" ;;
            esac
            exit "$code"
          }
          trap fail ERR

          matches_revision() {
            local candidate="$1"
            [[ -n "$candidate" ]] && { [[ "${REVISION:0:${#candidate}}" == "$candidate" ]] || [[ "${candidate:0:${#REVISION}}" == "$REVISION" ]]; }
          }

          render_get() {
            curl --fail-with-body --silent --show-error \
              --retry 4 --retry-all-errors --connect-timeout 10 --max-time 60 \
              --header "Authorization: Bearer $RENDER_API_KEY" "$1"
          }

          supabase_query() {
            local query="$1"
            curl --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors --connect-timeout 10 --max-time 120 \
              --request POST \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              --header 'Content-Type: application/json' \
              --data "$(jq -nc --arg query "$query" '{query:$query,read_only:false}')" \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query"
          }

          json_boolean() {
            local key="$1"
            jq -r --arg key "$key" '.. | objects | select(has($key)) | .[$key]' \
              | head -n 1
          }

          stage="identity"
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REVISION"

          stage="verify-gates"
          report pending "Main Verification" "Waiting for Verify and Security on exact main"
          for workflow in verify.yml security.yml; do
            state="missing:"
            for attempt in {1..180}; do
              state="$(gh run list --workflow "$workflow" --commit "$REVISION" \
                --event push --limit 10 --json status,conclusion \
                --jq 'if length == 0 then "missing:" else .[0].status + ":" + (.[0].conclusion // "") end')"
              case "$state" in
                completed:success) break ;;
                completed:*) echo "$workflow failed for $REVISION: $state" >&2; false ;;
              esac
              sleep 10
            done
            [[ "$state" == "completed:success" ]]
          done
          report success "Main Verification" "Verify and Security passed for ${REVISION:0:12}"

          stage="supabase-credentials"
          report pending "Supabase Migration" "Validating production migration authority"
          test -n "$SUPABASE_ACCESS_TOKEN"
          [[ "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]

          stage="supabase-probe"
          probe="$(supabase_query "select (to_regclass('public.medium_model_trial_calls') is not null) as quota_installed, (to_regprocedure('public.verify_schema_contract_v4(integer,text,integer)') is not null) as v4_installed;")"
          quota_installed="$(printf '%s' "$probe" | json_boolean quota_installed)"
          v4_installed="$(printf '%s' "$probe" | json_boolean v4_installed)"
          [[ "$quota_installed" == "true" || "$quota_installed" == "false" ]]
          [[ "$v4_installed" == "true" || "$v4_installed" == "false" ]]

          if [[ "$quota_installed" != "true" ]]; then
            stage="supabase-quota"
            supabase_query "$(cat supabase/migrations/20260801010000_medium_model_trial_quota.sql)" >/dev/null
          fi

          if [[ "$v4_installed" != "true" ]]; then
            stage="supabase-contract"
            supabase_query "$(cat supabase/migrations/20260801020000_schema_contract_attestation_v4.sql)" >/dev/null
          fi

          stage="supabase-verify"
          verification="$(supabase_query "select (to_regclass('public.medium_model_trial_calls') is not null) as quota_installed, public.verify_schema_contract_v4(4, '68fd46dfeac7cebc79f5b9ba4858a416c71188982d48cc5b9a3428bdea0af32e', 49) as contract_verified;")"
          [[ "$(printf '%s' "$verification" | json_boolean quota_installed)" == "true" ]]
          [[ "$(printf '%s' "$verification" | json_boolean contract_verified)" == "true" ]]
          report success "Supabase Migration" "Schema contract v4 and shared trial quota verified"

          stage="render-credentials"
          report pending "Render Production" "Configuring OpenRouter and deploying exact verified revision"
          test -n "$OPENROUTER_API_KEY"
          test -n "$RENDER_API_KEY"
          [[ "$RENDER_SERVICE_ID" =~ ^srv-[a-z0-9]+$ ]]

          stage="render-openrouter-set"
          curl --fail-with-body --silent --show-error \
            --retry 4 --retry-all-errors --connect-timeout 10 --max-time 60 \
            --request PUT \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header 'Content-Type: application/json' \
            --data "$(jq -nc --arg value "$OPENROUTER_API_KEY" '{value:$value}')" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/OPENROUTER_API_KEY" \
            >/dev/null

          stage="render-openrouter-verify"
          openrouter_env="$(render_get "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/OPENROUTER_API_KEY")"
          openrouter_key_name="$(jq -r '.key // .envVar.key // .[0].key // .[0].envVar.key // empty' <<<"$openrouter_env")"
          [[ "$openrouter_key_name" == "OPENROUTER_API_KEY" ]]

          stage="render-start"
          http_code=000
          curl_status=1
          for attempt in {1..20}; do
            if http_code="$(curl --silent --show-error \
              --retry 4 --retry-all-errors --retry-delay 2 \
              --connect-timeout 10 --max-time 60 \
              --request POST \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              --header 'Content-Type: application/json' \
              --data "$(jq -nc --arg commitId "$REVISION" '{commitId:$commitId}')" \
              --output /tmp/render-start.json \
              --write-out '%{http_code}' \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")"; then
              curl_status=0
            else
              curl_status=$?
            fi
            if [[ $curl_status -eq 0 && "$http_code" =~ ^2[0-9][0-9]$ ]]; then break; fi
            sleep 15
          done
          [[ $curl_status -eq 0 && "$http_code" =~ ^2[0-9][0-9]$ ]]

          response="$(cat /tmp/render-start.json 2>/dev/null || true)"
          deploy_id=""
          commit_id=""
          if [[ -n "${response//[[:space:]]/}" ]] && jq -e . >/dev/null 2>&1 <<<"$response"; then
            deploy_id="$(jq -r '.id // .deploy.id // .[0].id // .[0].deploy.id // empty' <<<"$response")"
            commit_id="$(jq -r '.commit.id // .deploy.commit.id // .commitId // .[0].commit.id // .[0].deploy.commit.id // empty' <<<"$response")"
          fi

          if [[ -z "$deploy_id" ]]; then
            stage="render-resolve"
            for attempt in {1..60}; do
              list="$(render_get "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=50")"
              deploy_id="$(jq -r --arg rev "$REVISION" '
                def rows: if type == "array" then .[] elif type == "object" and (.deploys | type) == "array" then .deploys[] else empty end;
                [rows | (.deploy // .) | (.commit.id // .commitId // "") as $commit |
                  select($commit != "" and (($commit == $rev) or ($rev | startswith($commit)) or ($commit | startswith($rev))))
                ] | first | .id // empty
              ' <<<"$list")"
              [[ -n "$deploy_id" ]] && break
              sleep 5
            done
          fi
          test -n "$deploy_id"
          [[ -z "$commit_id" ]] || matches_revision "$commit_id"

          stage="render-wait-live"
          status=""
          for attempt in {1..180}; do
            response="$(render_get "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$deploy_id")"
            status="$(jq -r '.status // .deploy.status // .[0].status // .[0].deploy.status // empty' <<<"$response")"
            commit_id="$(jq -r '.commit.id // .deploy.commit.id // .commitId // .[0].commit.id // .[0].deploy.commit.id // empty' <<<"$response")"
            test -n "$status"
            [[ -z "$commit_id" ]] || matches_revision "$commit_id"
            case "$status" in
              live) break ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated) false ;;
            esac
            sleep 10
          done
          [[ "$status" == "live" ]]

          stage="render-verify-revision"
          runtime_revision=""
          for attempt in {1..40}; do
            payload="$(curl --fail-with-body --silent --show-error \
              --retry 2 --retry-all-errors --connect-timeout 10 --max-time 60 \
              --header 'Accept: application/json' "$PRODUCTION_URL/api/ready" || true)"
            runtime_revision="$(jq -r '.revision // empty' <<<"$payload" 2>/dev/null || true)"
            if matches_revision "$runtime_revision"; then break; fi
            sleep 5
          done
          matches_revision "$runtime_revision"
          report success "Render Production" "Live exact revision ${REVISION:0:12}; database v4 verified"
          report success "Production Closure" "Production is live and exact revision verified"
          echo "Render deploy $deploy_id is live; production revision $runtime_revision"
