name: Force Render Web Deploy

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/force-render-web-deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  PRODUCTION_URL: https://mychat-nm6x.onrender.com

jobs:
  deploy:
    name: Deploy exact Matrix web revision
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REVISION: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - name: Deploy, wait, and verify production
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="initializing"

          report() {
            local state="$1"
            local context="$2"
            local description="$3"
            curl --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data "$(jq -nc --arg state "$state" --arg context "$context" --arg description "$description" --arg target_url "$PRODUCTION_URL" '{state:$state,context:$context,description:$description,target_url:$target_url}')" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$REVISION" >/dev/null || true
          }

          fail() {
            local code=$?
            trap - ERR
            report failure "Render Failure: $stage" "Exact production deploy failed at $stage"
            report failure "Render Production" "Render failed at $stage for ${REVISION:0:12}"
            exit "$code"
          }
          trap fail ERR

          report pending "Render Production" "Deploying exact Matrix web revision"

          stage="credentials"
          report pending "Render Stage: credentials" "Validating Render credentials"
          test -n "$RENDER_API_KEY"
          test -n "$RENDER_SERVICE_ID"
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          report success "Render Stage: credentials" "Render credentials validated"

          stage="start"
          report pending "Render Stage: start" "Starting exact Render deploy"
          http_code=000
          curl_status=1
          for attempt in {1..20}; do
            if http_code="$(curl --silent --show-error \
              --retry 4 --retry-all-errors --retry-delay 2 \
              --connect-timeout 10 --max-time 60 \
              --request POST \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              --header 'Content-Type: application/json' \
              --data "$(jq -nc --arg commitId "$REVISION" '{commitId: $commitId}')" \
              --output /tmp/render-start.json \
              --write-out '%{http_code}' \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")"; then
              curl_status=0
            else
              curl_status=$?
            fi
            if [[ $curl_status -eq 0 && "$http_code" =~ ^2[0-9][0-9]$ ]]; then
              break
            fi
            echo "Render deploy start attempt $attempt returned HTTP $http_code (curl $curl_status)" >&2
            cat /tmp/render-start.json >&2 2>/dev/null || true
            sleep 15
          done
          [[ $curl_status -eq 0 ]]
          [[ "$http_code" =~ ^2[0-9][0-9]$ ]]
          response="$(cat /tmp/render-start.json)"
          deploy_id="$(jq -er '.id' <<<"$response")"
          commit_id="$(jq -r '.commit.id // empty' <<<"$response")"
          [[ "$deploy_id" =~ ^dep-[a-z0-9]+$ ]]
          if [[ -n "$commit_id" && "$commit_id" != "$REVISION" ]]; then
            echo "Render selected $commit_id instead of $REVISION" >&2
            false
          fi
          report success "Render Stage: start" "Render deploy $deploy_id started"

          stage="wait-live"
          report pending "Render Stage: wait-live" "Waiting for Render to become live"
          status=""
          for attempt in {1..180}; do
            response="$(curl --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors --connect-timeout 10 --max-time 60 \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$deploy_id")"
            status="$(jq -er '.status' <<<"$response")"
            commit_id="$(jq -r '.commit.id // empty' <<<"$response")"
            if [[ -n "$commit_id" && "$commit_id" != "$REVISION" ]]; then
              echo "Render deploy changed revision to $commit_id" >&2
              false
            fi
            case "$status" in
              live) break ;;
              build_failed|update_failed|canceled|deactivated)
                echo "Render deploy failed: $status" >&2
                false
                ;;
            esac
            sleep 10
          done
          [[ "$status" == "live" ]]
          report success "Render Stage: wait-live" "Render deploy $deploy_id is live"

          stage="verify-revision"
          report pending "Render Stage: verify-revision" "Checking production revision"
          runtime_revision=""
          for attempt in {1..30}; do
            payload="$(curl --fail-with-body --silent --show-error \
              --retry 2 --retry-all-errors --connect-timeout 10 --max-time 60 \
              --header 'Accept: application/json' \
              "$PRODUCTION_URL/api/ready" || true)"
            runtime_revision="$(jq -r '.revision // empty' <<<"$payload" 2>/dev/null || true)"
            if [[ -n "$runtime_revision" && "${REVISION:0:${#runtime_revision}}" == "$runtime_revision" ]]; then
              break
            fi
            sleep 5
          done
          [[ -n "$runtime_revision" ]]
          [[ "${REVISION:0:${#runtime_revision}}" == "$runtime_revision" ]]
          report success "Render Stage: verify-revision" "Production serves $runtime_revision"
          report success "Render Production" "Render live; exact revision ${REVISION:0:12} verified"
          echo "Render deploy $deploy_id is live; production revision $runtime_revision"
