name: Diagnose DeepSeek Route

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-deepseek-route.yml

permissions:
  contents: write
  statuses: write

env:
  TARGET_URL: https://mychat-nm6x.onrender.com

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Generate exact baseline branch
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          stage=install
          report() {
            curl --silent --show-error --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data "$(jq -nc --arg state "$1" --arg context "DeepSeek Baseline: $2" --arg description "$3" --arg target_url "$TARGET_URL" '{state:$state,context:$context,description:$description,target_url:$target_url}')" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$REVISION" >/dev/null || true
          }
          fail() {
            local code=$?
            trap - ERR
            report failure "$stage" "Baseline generation failed at $stage"
            exit "$code"
          }
          trap fail ERR
          report pending running "Generating exact complexity baseline"
          npm ci --ignore-scripts --legacy-peer-deps
          stage=generate
          node scripts/check-function-complexity.mjs --print-baseline > scripts/function-complexity-baseline.json
          jq --exit-status . scripts/function-complexity-baseline.json >/dev/null
          stage=commit
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -B deepseek-route-baseline
          git add scripts/function-complexity-baseline.json
          git commit -m "Generate DeepSeek route complexity baseline"
          stage=push
          git push --force origin HEAD:refs/heads/deepseek-route-baseline
          report success staged "Exact baseline staged"
