name: Diagnose DeepSeek Route

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-deepseek-route.yml

permissions:
  contents: read
  statuses: write

env:
  TARGET_URL: https://mychat-nm6x.onrender.com

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Run staged verification
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          stage=install
          report() {
            curl --silent --show-error --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data "$(jq -nc --arg state "$1" --arg context "DeepSeek Verify: $2" --arg description "$3" --arg target_url "$TARGET_URL" '{state:$state,context:$context,description:$description,target_url:$target_url}')" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$REVISION" >/dev/null || true
          }
          fail() {
            local code=$?
            trap - ERR
            report failure "$stage" "Verification failed at $stage"
            exit "$code"
          }
          trap fail ERR
          report pending running "Running staged verification"
          npm ci --ignore-scripts --legacy-peer-deps
          for spec in \
            'architecture:npm run architecture' \
            'complexity:npm run complexity' \
            'migration-contract:npm run migration:contract' \
            'typecheck:npm run check' \
            'lint-backend:npm run lint:backend' \
            'lint:npm run lint' \
            'tests:npm test' \
            'build:npm run build'; do
            stage="${spec%%:*}"
            command="${spec#*:}"
            report pending "$stage" "Running $stage"
            bash -lc "$command"
            report success "$stage" "$stage passed"
          done
          report success complete "Core verification passed"
