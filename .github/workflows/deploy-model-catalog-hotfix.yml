name: Deploy Model Catalog Hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-model-catalog-hotfix.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: deploy-model-catalog-hotfix
  cancel-in-progress: true

env:
  PRODUCTION_URL: https://mychat-nm6x.onrender.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REVISION: ${{ github.sha }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Deploy and verify exact revision
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RENDER_API_KEY"
          [[ "$RENDER_SERVICE_ID" =~ ^srv-[a-z0-9]+$ ]]
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REVISION"

          response_file="$(mktemp)"
          http_code="$(curl --fail-with-body --silent --show-error \
            --retry 4 --retry-all-errors --connect-timeout 10 --max-time 60 \
            --request POST \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header 'Content-Type: application/json' \
            --data "$(jq -nc --arg commitId "$REVISION" '{commitId:$commitId}')" \
            --output "$response_file" \
            --write-out '%{http_code}' \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")"
          [[ "$http_code" =~ ^2[0-9][0-9]$ ]]

          deploy_id="$(jq -r '.id // .deploy.id // .[0].id // .[0].deploy.id // empty' "$response_file")"
          test -n "$deploy_id"

          status=""
          for attempt in {1..180}; do
            response="$(curl --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors --connect-timeout 10 --max-time 60 \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$deploy_id")"
            status="$(jq -r '.status // .deploy.status // empty' <<<"$response")"
            case "$status" in
              live) break ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "Render deploy failed: $status" >&2
                exit 1
                ;;
            esac
            sleep 10
          done
          [[ "$status" == "live" ]]

          runtime_revision=""
          for attempt in {1..60}; do
            payload="$(curl --fail-with-body --silent --show-error \
              --retry 2 --retry-all-errors --connect-timeout 10 --max-time 60 \
              --header 'Accept: application/json' "$PRODUCTION_URL/api/ready" || true)"
            runtime_revision="$(jq -r '.revision // empty' <<<"$payload" 2>/dev/null || true)"
            if [[ -n "$runtime_revision" ]] && [[ "$REVISION" == "$runtime_revision"* || "$runtime_revision" == "$REVISION"* ]]; then
              break
            fi
            sleep 5
          done
          [[ -n "$runtime_revision" ]]
          [[ "$REVISION" == "$runtime_revision"* || "$runtime_revision" == "$REVISION"* ]]
          echo "Render deploy $deploy_id is live at revision $runtime_revision"
