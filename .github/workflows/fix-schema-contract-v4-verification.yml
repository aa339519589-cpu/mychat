name: Fix Schema Contract V4 Verification

on:
  push:
    branches:
      - feature/openrouter-model-catalog-20260801
    paths:
      - .github/workflows/fix-schema-contract-v4-verification.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feature/openrouter-model-catalog-20260801
      - name: Patch PostgreSQL migration verification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-generation-migrations-pg16.sh')
          text = path.read_text()
          start = text.index('CONTRACT_VERSION="$(node -e')
          end = text.index('\necho "PostgreSQL generation migration verification passed"', start)
          replacement = Path('scripts/schema-contract-tail-v4.sh.inc').read_text().rstrip() + '\n'
          path.write_text(text[:start] + replacement + text[end:])
          PY
          grep -q 'verify_schema_contract_v4' scripts/verify-generation-migrations-pg16.sh
          grep -q 'Exact historical v3 schema contract' scripts/verify-generation-migrations-pg16.sh
      - name: Commit final source and remove patch machinery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/verify-generation-migrations-pg16.sh
          git rm scripts/schema-contract-tail-v4.sh.inc .github/workflows/fix-schema-contract-v4-verification.yml
          git commit -m "Verify historical v3 and current v4 schema contracts"
          git push origin HEAD:feature/openrouter-model-catalog-20260801
