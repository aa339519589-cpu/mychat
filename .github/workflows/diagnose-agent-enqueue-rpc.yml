name: Diagnose Agent Enqueue RPC

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-agent-enqueue-rpc.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_URL: https://usibkqqksgwgvdiqwpyo.supabase.co
    steps:
      - name: Capture sanitized RPC response
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          secret() {
            curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/$1" | jq -r '.value // .envVar.value // empty'
          }
          service_role="$(secret SUPABASE_SERVICE_ROLE_KEY)"
          anon_key="$(secret NEXT_PUBLIC_SUPABASE_ANON_KEY)"
          admin=(-H "apikey: $service_role" -H "Authorization: Bearer $service_role" -H 'Content-Type: application/json')
          email="rpc-smoke-${GITHUB_RUN_ID}@example.invalid"
          password="Smoke-$(cat /proc/sys/kernel/random/uuid)-A1!"
          session_id="$(cat /proc/sys/kernel/random/uuid)"
          message_id="$(cat /proc/sys/kernel/random/uuid)"
          response_id="$(cat /proc/sys/kernel/random/uuid)"
          task_id="$(cat /proc/sys/kernel/random/uuid)"
          job_id="$(cat /proc/sys/kernel/random/uuid)"
          repo="__mychat_new__/$session_id"
          user_id=''
          cleanup() {
            set +e
            curl -sS -X DELETE "${admin[@]}" "$SUPABASE_URL/rest/v1/jobs?id=eq.$job_id" >/dev/null
            curl -sS -X DELETE "${admin[@]}" "$SUPABASE_URL/rest/v1/agent_tasks?id=eq.$task_id" >/dev/null
            curl -sS -X DELETE "${admin[@]}" "$SUPABASE_URL/rest/v1/code_messages?session_id=eq.$session_id" >/dev/null
            curl -sS -X DELETE "${admin[@]}" "$SUPABASE_URL/rest/v1/code_sessions?id=eq.$session_id" >/dev/null
            [[ -n "$user_id" ]] && curl -sS -X DELETE "${admin[@]}" "$SUPABASE_URL/auth/v1/admin/users/$user_id" >/dev/null
          }
          trap cleanup EXIT
          created="$(curl --fail-with-body -sS -X POST "${admin[@]}" \
            --data "$(jq -nc --arg e "$email" --arg p "$password" '{email:$e,password:$p,email_confirm:true}')" \
            "$SUPABASE_URL/auth/v1/admin/users")"
          user_id="$(jq -r '.id // .user.id' <<<"$created")"
          signed="$(curl --fail-with-body -sS -X POST -H "apikey: $anon_key" -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg e "$email" --arg p "$password" '{email:$e,password:$p}')" \
            "$SUPABASE_URL/auth/v1/token?grant_type=password")"
          token="$(jq -r '.access_token' <<<"$signed")"
          user=(-H "apikey: $anon_key" -H "Authorization: Bearer $token" -H 'Content-Type: application/json')
          curl --fail-with-body -sS -X POST "${user[@]}" --data "$(jq -nc --arg id "$session_id" --arg u "$user_id" --arg r "$repo" '{id:$id,user_id:$u,repo:$r,title:"rpc diagnostic"}')" "$SUPABASE_URL/rest/v1/code_sessions" >/dev/null
          curl --fail-with-body -sS -X POST "${user[@]}" --data "$(jq -nc --arg id "$message_id" --arg s "$session_id" --arg u "$user_id" '{id:$id,session_id:$s,user_id:$u,role:"user",content:"rpc diagnostic",meta:null}')" "$SUPABASE_URL/rest/v1/code_messages" >/dev/null
          payload="$(jq -nc --arg r "$repo" --arg s "$session_id" --arg x "$response_id" --arg m "$message_id" '{schemaVersion:1,repo:$r,modelId:"deepseek-v4-flash",accessClass:"quota",reasoningEffort:"none",sessionId:$s,responseId:$x,userMessageId:$m,usingBalance:false}')"
          body="$(jq -nc --arg u "$user_id" --arg t "$task_id" --arg r "$repo" --arg s "$session_id" --arg x "$response_id" --arg m "$message_id" --arg j "$job_id" --arg h "$(printf '%s' "$payload"|sha256sum|cut -d' ' -f1)" --argjson p "$payload" '{input_user_id:$u,input_task_id:$t,input_goal:"rpc diagnostic",input_repo:$r,input_session_id:$s,input_response_id:$x,input_user_message_id:$m,input_job_id:$j,input_auth_class:"registered",input_idempotency_key:("rpc:"+$t+":"+$x),input_input_hash:$h,input_payload:$p}')"
          for mode in user admin; do
            out="$(mktemp)"
            if [[ "$mode" == user ]]; then headers=("${user[@]}"); else headers=("${admin[@]}"); fi
            status="$(curl -sS -o "$out" -w '%{http_code}' -X POST "${headers[@]}" --data "$body" "$SUPABASE_URL/rest/v1/rpc/enqueue_agent_task_job")"
            sanitized="$(jq -c 'del(.hint,.details) | if .message then .message=(.message|tostring|.[0:300]) else . end' "$out" 2>/dev/null || tr '\r\n' ' ' < "$out" | cut -c1-300)"
            echo "RPC_RESPONSE mode=$mode status=$status body=$sanitized"
            rm -f "$out"
          done
