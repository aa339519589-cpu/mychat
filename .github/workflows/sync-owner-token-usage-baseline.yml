name: Sync Owner Token Usage Baseline

on:
  push:
    branches:
      - owner-token-usage-ui
    paths:
      - .github/workflows/sync-owner-token-usage-baseline.yml

permissions:
  contents: write
  statuses: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: owner-token-usage-ui
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Generate exact baseline
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          report() {
            curl --silent --show-error --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data "$(jq -nc --arg state "$1" --arg context "Owner Token Baseline" --arg description "$2" '{state:$state,context:$context,description:$description}')" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$REVISION" >/dev/null || true
          }
          trap 'report failure "Exact baseline generation failed"' ERR
          report pending "Generating exact complexity baseline"
          npm ci --ignore-scripts --legacy-peer-deps
          node scripts/check-function-complexity.mjs --print-baseline > scripts/function-complexity-baseline.json
          jq --exit-status . scripts/function-complexity-baseline.json >/dev/null
          if git diff --quiet -- scripts/function-complexity-baseline.json; then
            report success "Complexity baseline already exact"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/function-complexity-baseline.json
          git commit -m "Sync complexity baseline for owner token usage"
          git push origin HEAD:owner-token-usage-ui
          report success "Exact complexity baseline committed"
