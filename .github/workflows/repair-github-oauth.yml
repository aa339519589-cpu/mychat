name: Repair GitHub OAuth on Render

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-github-oauth.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: repair-github-oauth
  cancel-in-progress: false

jobs:
  repair:
    name: Restore GitHub OAuth configuration
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PRODUCTION_URL: https://mychat-nm6x.onrender.com
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Mark repair pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jq -nc --arg context "GitHub OAuth Repair" --arg description "Checking Render OAuth configuration" '{
            state: "pending",
            context: $context,
            description: $description
          }' | gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --input - >/dev/null

      - name: Restore required Render environment variables
        id: oauth
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          SOURCE_GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          SOURCE_GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
          SOURCE_AGENT_CREDENTIAL_KEY: ${{ secrets.AGENT_CREDENTIAL_KEY }}
          SOURCE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$RENDER_API_KEY" ]] || [[ ! "$RENDER_SERVICE_ID" =~ ^srv-[a-z0-9]+$ ]]; then
            echo "Render deployment credentials are unavailable" >&2
            exit 1
          fi

          base="https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars"
          auth=(--header "Authorization: Bearer $RENDER_API_KEY" --header 'Content-Type: application/json')

          read_value() {
            local key="$1"
            local body status
            body="$(mktemp)"
            status="$(curl --silent --show-error --connect-timeout 10 --max-time 60 \
              "${auth[@]}" --output "$body" --write-out '%{http_code}' "$base/$key")"
            if [[ "$status" == "200" ]]; then
              jq -r '.value // empty' "$body"
            fi
            rm -f "$body"
          }

          write_value() {
            local key="$1" value="$2"
            curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 60 \
              "${auth[@]}" --request PUT --data "$(jq -nc --arg value "$value" '{value:$value}')" \
              "$base/$key" >/dev/null
          }

          ensure_value() {
            local key="$1" source="$2" minimum="$3"
            local current
            current="$(read_value "$key")"
            if (( ${#current} >= minimum )); then
              return 0
            fi
            if (( ${#source} >= minimum )); then
              write_value "$key" "$source"
              current="$(read_value "$key")"
            fi
            if (( ${#current} < minimum )); then
              missing+=("$key")
            fi
          }

          missing=()
          ensure_value GITHUB_CLIENT_ID "$SOURCE_GITHUB_CLIENT_ID" 1
          ensure_value GITHUB_CLIENT_SECRET "$SOURCE_GITHUB_CLIENT_SECRET" 1
          ensure_value AGENT_CREDENTIAL_KEY "$SOURCE_AGENT_CREDENTIAL_KEY" 32
          ensure_value SUPABASE_SERVICE_ROLE_KEY "$SOURCE_SUPABASE_SERVICE_ROLE_KEY" 1

          if (( ${#missing[@]} > 0 )); then
            joined="$(IFS=,; echo "${missing[*]}")"
            echo "missing=$joined" >> "$GITHUB_OUTPUT"
            echo "Missing OAuth dependencies: $joined" >&2
            exit 1
          fi
          echo "missing=" >> "$GITHUB_OUTPUT"

      - name: Deploy repaired revision to Render
        id: deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          response="$(curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 60 \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header 'Content-Type: application/json' \
            --request POST \
            --data "$(jq -nc --arg commitId "$GITHUB_SHA" '{commitId:$commitId}')" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")"
          deploy_id="$(jq -er '.id' <<<"$response")"
          [[ "$deploy_id" =~ ^dep-[a-z0-9]+$ ]]
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

      - name: Wait for repaired deployment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
        run: |
          for attempt in {1..180}; do
            response="$(curl --fail-with-body --silent --show-error \
              --retry 4 --retry-all-errors --connect-timeout 10 --max-time 60 \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$RENDER_DEPLOY_ID")"
            status="$(jq -er '.status' <<<"$response")"
            commit="$(jq -r '.commit.id // empty' <<<"$response")"
            if [[ -n "$commit" && "$commit" != "$GITHUB_SHA" ]]; then
              echo "Render resolved a different commit: $commit" >&2
              exit 1
            fi
            case "$status" in
              live)
                [[ "$commit" == "$GITHUB_SHA" ]]
                exit 0
                ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "Render deploy failed with status $status" >&2
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Render deploy timed out" >&2
          exit 1

      - name: Verify OAuth route is enabled
        run: |
          for attempt in {1..30}; do
            status="$(curl --silent --show-error --output /tmp/oauth-body \
              --write-out '%{http_code}' --connect-timeout 10 --max-time 30 \
              "$PRODUCTION_URL/api/auth/github" || true)"
            if [[ "$status" == "401" || "$status" == "302" ]]; then
              exit 0
            fi
            if [[ "$status" == "503" ]]; then
              cat /tmp/oauth-body >&2 || true
            fi
            sleep 5
          done
          echo "GitHub OAuth route remains unavailable" >&2
          exit 1

      - name: Record repair result
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          MISSING: ${{ steps.oauth.outputs.missing }}
        run: |
          if [[ "$JOB_STATUS" == "success" ]]; then
            state="success"
            description="GitHub OAuth is enabled on Render"
          else
            state="failure"
            if [[ -n "$MISSING" ]]; then
              description="Missing Render secrets: ${MISSING:0:105}"
            else
              description="GitHub OAuth repair failed"
            fi
          fi
          jq -nc --arg state "$state" --arg context "GitHub OAuth Repair" --arg description "$description" \
            '{state:$state,context:$context,description:$description}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --input - >/dev/null
