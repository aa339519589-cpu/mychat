name: Repair dependency audit

on:
  push:
    branches:
      - fix/claude-native-reasoning-ci
    paths:
      - .github/workflows/repair-dependency-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/claude-native-reasoning-ci

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Refresh production dependency lockfile
        run: npm audit fix --package-lock-only --omit=dev --legacy-peer-deps

      - name: Show remaining production audit findings
        run: npm audit --omit=dev --audit-level=high || true

      - name: Commit repaired lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes were generated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: apply npm audit lockfile fixes"
          git push origin HEAD:fix/claude-native-reasoning-ci
