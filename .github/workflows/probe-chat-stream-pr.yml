name: Production Chat Stream Probe

on:
  pull_request:
    paths:
      - scripts/probe-production-chat-stream.mjs
      - scripts/probe-production-chat-ui.mjs
      - .github/workflows/probe-chat-stream-pr.yml

permissions:
  contents: read

jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRODUCTION_URL: https://mychat-nm6x.onrender.com
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Send real 2200-character request through production Chat transport
        run: node scripts/probe-production-chat-stream.mjs

  mobile-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRODUCTION_URL: https://mychat-nm6x.onrender.com
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - name: Send real 2200-character request through the production mobile Chat UI
        run: node scripts/probe-production-chat-ui.mjs
