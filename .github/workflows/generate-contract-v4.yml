name: Generate Migration Contract V4

on:
  push:
    branches:
      - feature/openrouter-model-catalog-20260801
    paths:
      - .github/workflows/generate-contract-v4.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feature/openrouter-model-catalog-20260801
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: node scripts/generate-migration-contract-v4.mjs
      - name: Commit generated contract
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/migrations.manifest.json supabase/migrations/20260801020000_schema_contract_attestation_v4.sql
          git commit -m "Seal migration contract v4"
          git push origin HEAD:feature/openrouter-model-catalog-20260801
