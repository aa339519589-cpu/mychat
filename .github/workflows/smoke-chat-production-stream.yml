name: Smoke Chat Production Stream

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/smoke-chat-production-stream.yml

permissions:
  contents: read
  statuses: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRODUCTION_URL: https://mychat-nm6x.onrender.com
      SUPABASE_URL: https://usibkqqksgwgvdiqwpyo.supabase.co
    steps:
      - name: Run authenticated 2200-character Chat stream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          post_status() {
            jq -nc --arg state "$1" --arg context "Chat Production Stream" --arg description "${2:0:140}" --arg target_url "$RUN_URL" \
              '{state:$state,context:$context,description:$description,target_url:$target_url}' \
              | gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --input - >/dev/null
          }

          render_secret() {
            local key="$1" value='' response
            for attempt in {1..20}; do
              response="$(curl --silent --show-error --retry 3 --retry-all-errors \
                -H "Authorization: Bearer $RENDER_API_KEY" \
                "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/$key" 2>/dev/null)" || response='{}'
              value="$(jq -r '.value // .envVar.value // empty' <<<"$response" 2>/dev/null || true)"
              [[ -n "$value" ]] && { printf '%s' "$value"; return 0; }
              sleep 3
            done
            return 1
          }

          post_status pending "Creating an isolated production Chat session"
          service_role="$(render_secret SUPABASE_SERVICE_ROLE_KEY)"
          anon_key="$(render_secret NEXT_PUBLIC_SUPABASE_ANON_KEY)"
          test -n "$service_role"
          test -n "$anon_key"

          admin_auth=(-H "apikey: $service_role" -H "Authorization: Bearer $service_role" -H 'Content-Type: application/json')
          email="chat-stream-smoke-${GITHUB_RUN_ID}@example.invalid"
          password="Smoke-$(cat /proc/sys/kernel/random/uuid)-A1!"
          user_id=''
          conversation_id="$(cat /proc/sys/kernel/random/uuid)"
          user_message_id="$(cat /proc/sys/kernel/random/uuid)"
          assistant_message_id="$(cat /proc/sys/kernel/random/uuid)"
          generation_id="$(cat /proc/sys/kernel/random/uuid)"

          cleanup() {
            set +e
            curl --silent --show-error -X DELETE "${admin_auth[@]}" "$SUPABASE_URL/rest/v1/job_events?job_id=eq.$generation_id" >/dev/null
            curl --silent --show-error -X DELETE "${admin_auth[@]}" "$SUPABASE_URL/rest/v1/jobs?id=eq.$generation_id" >/dev/null
            curl --silent --show-error -X DELETE "${admin_auth[@]}" "$SUPABASE_URL/rest/v1/messages?conversation_id=eq.$conversation_id" >/dev/null
            curl --silent --show-error -X DELETE "${admin_auth[@]}" "$SUPABASE_URL/rest/v1/conversations?id=eq.$conversation_id" >/dev/null
            if [[ -n "$user_id" ]]; then
              curl --silent --show-error -X DELETE "${admin_auth[@]}" "$SUPABASE_URL/auth/v1/admin/users/$user_id" >/dev/null
            fi
          }
          trap cleanup EXIT

          created_user="$(curl --fail-with-body --silent --show-error -X POST "${admin_auth[@]}" \
            --data "$(jq -nc --arg email "$email" --arg password "$password" '{email:$email,password:$password,email_confirm:true}')" \
            "$SUPABASE_URL/auth/v1/admin/users")"
          user_id="$(jq -r '.id // .user.id // empty' <<<"$created_user")"
          test -n "$user_id"

          signed_in="$(curl --fail-with-body --silent --show-error -X POST \
            -H "apikey: $anon_key" -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg email "$email" --arg password "$password" '{email:$email,password:$password}')" \
            "$SUPABASE_URL/auth/v1/token?grant_type=password")"
          access_token="$(jq -r '.access_token // empty' <<<"$signed_in")"
          test -n "$access_token"

          export ACCESS_TOKEN="$access_token"
          export CONVERSATION_ID="$conversation_id"
          export USER_MESSAGE_ID="$user_message_id"
          export ASSISTANT_MESSAGE_ID="$assistant_message_id"
          export GENERATION_ID="$generation_id"

          node <<'NODE'
          const productionUrl = process.env.PRODUCTION_URL
          const token = process.env.ACCESS_TOKEN
          const prompt = '请直接输出一篇不少于2200个中文字符、约2500字的连续说明文，主题是为什么真正的流式输出必须持续平滑推进。不要调用工具，不要搜索，不要省略，不要提前结束。'
          const body = {
            tier: '绝句',
            messages: [{
              id: process.env.USER_MESSAGE_ID,
              role: 'user',
              content: prompt,
              ts: new Date().toISOString(),
            }],
            conversationId: process.env.CONVERSATION_ID,
            userMessageId: process.env.USER_MESSAGE_ID,
            generationId: process.env.GENERATION_ID,
            assistantMessageId: process.env.ASSISTANT_MESSAGE_ID,
            historyRetrieval: false,
            searchMode: 'off',
            renderEnabled: false,
            turn: {
              schemaVersion: 1,
              createConversation: true,
              title: '[system] Chat production stream smoke',
              projectId: null,
            },
          }

          const acceptedAtStart = Date.now()
          const accepted = await fetch(`${productionUrl}/api/chat`, {
            method: 'POST',
            headers: {
              authorization: `Bearer ${token}`,
              'content-type': 'application/json',
            },
            body: JSON.stringify(body),
            signal: AbortSignal.timeout(120_000),
          })
          const acceptedText = await accepted.text()
          if (accepted.status !== 202) {
            throw new Error(`Chat admission HTTP ${accepted.status}: ${acceptedText.slice(0, 500)}`)
          }
          const admission = JSON.parse(acceptedText)
          const streamUrl = new URL(admission.streamUrl, productionUrl)
          const stream = await fetch(streamUrl, {
            headers: { authorization: `Bearer ${token}` },
            signal: AbortSignal.timeout(12 * 60_000),
          })
          if (!stream.ok || !stream.body) {
            throw new Error(`Chat stream HTTP ${stream.status}: ${(await stream.text()).slice(0, 500)}`)
          }

          const decoder = new TextDecoder()
          const reader = stream.body.getReader()
          let buffer = ''
          let text = ''
          let terminal = null
          let firstTextAt = null
          let previousTextAt = null
          let maxGapMs = 0
          let largestChunk = 0
          let textEvents = 0
          const startedAt = Date.now()

          const consumeFrame = frame => {
            let eventName = ''
            let data = ''
            for (const line of frame.split('\n')) {
              if (line.startsWith('event:')) eventName = line.slice(6).trim()
              if (line.startsWith('data:')) data += line.slice(5).trim()
            }
            if (!data) return
            const envelope = JSON.parse(data)
            if (eventName === 'text.delta') {
              const chunk = typeof envelope.payload?.text === 'string' ? envelope.payload.text : ''
              if (!chunk) return
              const now = Date.now()
              if (firstTextAt === null) firstTextAt = now
              if (previousTextAt !== null) maxGapMs = Math.max(maxGapMs, now - previousTextAt)
              previousTextAt = now
              largestChunk = Math.max(largestChunk, chunk.length)
              textEvents += 1
              text += chunk
            }
            if (eventName === 'job.terminal') terminal = envelope.payload?.status ?? null
          }

          while (true) {
            const result = await reader.read()
            if (result.done) break
            buffer += decoder.decode(result.value, { stream: true }).replace(/\r\n/g, '\n')
            let boundary = buffer.indexOf('\n\n')
            while (boundary >= 0) {
              consumeFrame(buffer.slice(0, boundary))
              buffer = buffer.slice(boundary + 2)
              boundary = buffer.indexOf('\n\n')
            }
          }
          buffer += decoder.decode()
          if (buffer.trim()) consumeFrame(buffer)

          const metrics = {
            admissionMs: startedAt - acceptedAtStart,
            firstTextMs: firstTextAt === null ? null : firstTextAt - startedAt,
            durationMs: Date.now() - startedAt,
            textChars: text.length,
            textEvents,
            largestChunk,
            maxGapMs,
            terminal,
          }
          console.log(`CHAT_STREAM_METRICS ${JSON.stringify(metrics)}`)
          console.log(`CHAT_STREAM_PREFIX ${text.slice(0, 120).replace(/\s+/g, ' ')}`)
          if (terminal !== 'completed') throw new Error(`Chat terminal status was ${terminal}`)
          if (text.length < 2000) throw new Error(`Chat returned only ${text.length} characters`)
          if (textEvents < 20) throw new Error(`Chat returned only ${textEvents} visible text events`)
          if (maxGapMs > 2_000) throw new Error(`Chat stream stalled for ${maxGapMs} ms after visible output began`)
          NODE

          post_status success "2200+ character production Chat stream completed without multi-second delivery stalls"
