name: Probe project memory isolation after release
on:
  push:
    branches: [audit/mychat-20261003]
    paths:
      - .github/workflows/probe-project-memory-only.yml
      - scripts/probe-project-memory-only.mjs
permissions:
  contents: read
jobs:
  authenticated-project-memory-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Verify one authenticated project-memory isolation scenario
        run: node scripts/probe-project-memory-only.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: project-memory-isolation-audit
          path: audit-output/project-memory-report.json
          retention-days: 7
