name: Probe Production Chat Paths
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-chat-paths-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Measure real text, search and photo requests
        env:
          PRODUCTION_URL: https://mychat-nm6x.onrender.com
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: node scripts/probe-production-chat-paths.mjs
