name: Apply Code Agent RPC Fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-code-agent-rpc-fix.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: apply-code-agent-rpc-fix
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: usibkqqksgwgvdiqwpyo
  SUPABASE_URL: https://usibkqqksgwgvdiqwpyo.supabase.co

jobs:
  apply-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Apply migration and run production Code smoke test
        run: |
          set -Eeuo pipefail
          stage=initializing
          post_status() {
            jq -nc --arg state "$1" --arg context "$2" --arg description "${3:0:140}" --arg target_url "$RUN_URL" \
              '{state:$state,context:$context,description:$description,target_url:$target_url}' \
              | gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --input - >/dev/null
          }
          fail() {
            code=$?
            trap - ERR
            post_status failure "Code Database Fix" "Failed at $stage"
            exit "$code"
          }
          trap fail ERR
          query() {
            curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
              --connect-timeout 10 --max-time 180 --request POST \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              --header 'Content-Type: application/json' \
              --data "$(jq -nc --arg query "$1" '{query:$query,read_only:false}')" \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query"
          }
          render_secret() {
            local key="$1" response value=''
            for attempt in {1..20}; do
              response="$(curl --silent --show-error --retry 3 --retry-all-errors \
                -H "Authorization: Bearer $RENDER_API_KEY" \
                "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/$key" 2>/dev/null)" || response='{}'
              value="$(jq -r '.value // .envVar.value // empty' <<<"$response" 2>/dev/null || true)"
              [[ -n "$value" ]] && { printf '%s' "$value"; return 0; }
              sleep 3
            done
            return 1
          }

          stage=credentials
          test -n "$SUPABASE_ACCESS_TOKEN"
          post_status pending "Code Database Fix" "Applying service-role claim compatibility migration"

          stage=apply-migration
          query "$(cat supabase/migrations/20260802181500_fix_service_role_claim_context.sql)" >/dev/null

          stage=verify-definition
          verification="$(query "select position('request.jwt.claims' in pg_get_functiondef('public.assert_agent_confirmation_actor(uuid)'::regprocedure)) > 0 as claim_json_supported, has_function_privilege('service_role','public.enqueue_agent_task_job(uuid,uuid,text,text,uuid,uuid,uuid,uuid,text,text,text,jsonb)','EXECUTE') as service_role_can_enqueue;")"
          claim_supported="$(jq -r '.. | objects | select(has("claim_json_supported")) | .claim_json_supported' <<<"$verification" | head -n 1)"
          role_granted="$(jq -r '.. | objects | select(has("service_role_can_enqueue")) | .service_role_can_enqueue' <<<"$verification" | head -n 1)"
          test "$claim_supported" = true
          test "$role_granted" = true
          post_status success "Code Database Fix" "Service-role claim parsing and Agent enqueue grant verified"

          stage=load-runtime-secrets
          service_role="$(render_secret SUPABASE_SERVICE_ROLE_KEY)"
          test -n "$service_role"
          admin=(-H "apikey: $service_role" -H "Authorization: Bearer $service_role" -H 'Content-Type: application/json')
          prefer=(-H 'Prefer: return=representation')

          email="code-rpc-fix-${GITHUB_RUN_ID}@example.invalid"
          password="Smoke-$(cat /proc/sys/kernel/random/uuid)-A1!"
          session_id="$(cat /proc/sys/kernel/random/uuid)"
          message_id="$(cat /proc/sys/kernel/random/uuid)"
          response_id="$(cat /proc/sys/kernel/random/uuid)"
          task_id="$(cat /proc/sys/kernel/random/uuid)"
          job_id="$(cat /proc/sys/kernel/random/uuid)"
          repo="__mychat_new__/$session_id"
          prompt='规划创建一个最简单的静态网页，调用计划工具并完成规划；最终正文包含 CODE_SMOKE_OK。'
          user_id=''

          cleanup() {
            set +e
            curl -sS -X DELETE "${admin[@]}" "$SUPABASE_URL/rest/v1/jobs?id=eq.$job_id" >/dev/null
            curl -sS -X DELETE "${admin[@]}" "$SUPABASE_URL/rest/v1/agent_tasks?id=eq.$task_id" >/dev/null
            curl -sS -X DELETE "${admin[@]}" "$SUPABASE_URL/rest/v1/code_messages?session_id=eq.$session_id" >/dev/null
            curl -sS -X DELETE "${admin[@]}" "$SUPABASE_URL/rest/v1/code_sessions?id=eq.$session_id" >/dev/null
            [[ -n "$user_id" ]] && curl -sS -X DELETE "${admin[@]}" "$SUPABASE_URL/auth/v1/admin/users/$user_id" >/dev/null
          }
          trap cleanup EXIT

          stage=create-smoke-context
          created="$(curl --fail-with-body -sS -X POST "${admin[@]}" \
            --data "$(jq -nc --arg e "$email" --arg p "$password" '{email:$e,password:$p,email_confirm:true}')" \
            "$SUPABASE_URL/auth/v1/admin/users")"
          user_id="$(jq -r '.id // .user.id // empty' <<<"$created")"
          test -n "$user_id"
          curl --fail-with-body -sS -X POST "${admin[@]}" "${prefer[@]}" \
            --data "$(jq -nc --arg id "$session_id" --arg u "$user_id" --arg r "$repo" '{id:$id,user_id:$u,repo:$r,title:"[system] Code RPC repair smoke"}')" \
            "$SUPABASE_URL/rest/v1/code_sessions" >/dev/null
          curl --fail-with-body -sS -X POST "${admin[@]}" "${prefer[@]}" \
            --data "$(jq -nc --arg id "$message_id" --arg s "$session_id" --arg u "$user_id" --arg c "$prompt" '{id:$id,session_id:$s,user_id:$u,role:"user",content:$c,meta:null}')" \
            "$SUPABASE_URL/rest/v1/code_messages" >/dev/null

          payload="$(jq -nc --arg r "$repo" --arg s "$session_id" --arg x "$response_id" --arg m "$message_id" '{schemaVersion:1,repo:$r,modelId:"deepseek-v4-flash",accessClass:"quota",reasoningEffort:"none",sessionId:$s,responseId:$x,userMessageId:$m,usingBalance:false}')"
          body="$(jq -nc --arg u "$user_id" --arg t "$task_id" --arg g "$prompt" --arg r "$repo" --arg s "$session_id" --arg x "$response_id" --arg m "$message_id" --arg j "$job_id" --arg h "$(printf '%s' "$payload"|sha256sum|cut -d' ' -f1)" --argjson p "$payload" '{input_user_id:$u,input_task_id:$t,input_goal:$g,input_repo:$r,input_session_id:$s,input_response_id:$x,input_user_message_id:$m,input_job_id:$j,input_auth_class:"registered",input_idempotency_key:("rpc-fix:"+$t+":"+$x),input_input_hash:$h,input_payload:$p}')"

          stage=enqueue-smoke-job
          enqueue="$(curl --fail-with-body -sS -X POST "${admin[@]}" "${prefer[@]}" \
            --data "$body" "$SUPABASE_URL/rest/v1/rpc/enqueue_agent_task_job")"
          echo "CODE_SMOKE_ENQUEUE $(jq -c '.' <<<"$enqueue")"
          post_status pending "Code Production Smoke" "Agent job enqueued; waiting for model output"

          stage=wait-smoke-job
          final=''
          for attempt in {1..120}; do
            rows="$(curl --fail-with-body -sS "${admin[@]}" "$SUPABASE_URL/rest/v1/jobs?id=eq.$job_id&select=*")"
            status="$(jq -r '.[0].status // "missing"' <<<"$rows")"
            case "$status" in completed|failed|cancelled) final="$rows"; break;; esac
            sleep 4
          done
          test -n "$final"
          status="$(jq -r '.[0].status' <<<"$final")"
          error_code="$(jq -r '.[0].error_code // .[0].error.code // "none"' <<<"$final")"
          result_text="$(jq -r '.[0].result.content // empty' <<<"$final")"
          if [[ -z "$result_text" ]]; then
            events="$(curl --fail-with-body -sS "${admin[@]}" "$SUPABASE_URL/rest/v1/job_events?job_id=eq.$job_id&kind=eq.text.delta&select=payload&order=seq.asc")"
            result_text="$(jq -r 'map(.payload.text // "") | join("")' <<<"$events")"
          fi
          compact="$(printf '%s' "$result_text" | tr '\r\n' ' ' | cut -c1-100)"
          echo "CODE_SMOKE_RESULT status=$status error=$error_code text=$compact"
          test "$status" = completed
          test -n "$result_text"
          post_status success "Code Production Smoke" "Queue, Agent worker, model and streamed result completed"
