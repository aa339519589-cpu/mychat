name: Recover Render Production
# Recovery trigger: deploy smooth character-by-character Code output.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/recover-render-production.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: recover-render-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Repair OAuth and deploy current main
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PRODUCTION_URL: https://mychat-nm6x.onrender.com
    steps:
      - name: Checkout current main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Confirm immutable revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Mark recovery pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -nc --arg context "Render Recovery" --arg description "Repairing GitHub OAuth and deploying main" --arg target_url "$RUN_URL" '{
            state: "pending",
            context: $context,
            description: $description,
            target_url: $target_url
          }' | gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --input - >/dev/null

      - name: Configure Render and restore OAuth dependencies
        id: oauth
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          SOURCE_GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          SOURCE_GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
          SOURCE_AGENT_CREDENTIAL_KEY: ${{ secrets.AGENT_CREDENTIAL_KEY }}
          SOURCE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$RENDER_API_KEY" ]] || [[ ! "$RENDER_SERVICE_ID" =~ ^srv-[a-z0-9]+$ ]]; then
            echo "Render deployment credentials are unavailable" >&2
            exit 1
          fi

          service="https://api.render.com/v1/services/$RENDER_SERVICE_ID"
          env_base="$service/env-vars"
          auth=(--header "Authorization: Bearer $RENDER_API_KEY" --header 'Content-Type: application/json')

          curl --fail-with-body --silent --show-error --retry 4 --retry-all-errors \
            --connect-timeout 10 --max-time 60 "${auth[@]}" --request PATCH \
            --data '{"autoDeploy":"no","serviceDetails":{"healthCheckPath":"/api/live"}}' \
            "$service" >/dev/null
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 60 \
            "${auth[@]}" --request PUT --data '{"value":"off"}' \
            "$env_base/MYCHAT_MAINTENANCE_MODE" >/dev/null

          read_value() {
            local key="$1" body status
            body="$(mktemp)"
            status="$(curl --silent --show-error --connect-timeout 10 --max-time 60 \
              "${auth[@]}" --output "$body" --write-out '%{http_code}' "$env_base/$key")"
            if [[ "$status" == "200" ]]; then
              jq -r '.value // empty' "$body"
            fi
            rm -f "$body"
          }

          write_value() {
            local key="$1" value="$2"
            curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 60 \
              "${auth[@]}" --request PUT --data "$(jq -nc --arg value "$value" '{value:$value}')" \
              "$env_base/$key" >/dev/null
          }

          ensure_value() {
            local key="$1" source="$2" minimum="$3" current
            current="$(read_value "$key")"
            if (( ${#current} < minimum )) && (( ${#source} >= minimum )); then
              write_value "$key" "$source"
              current="$(read_value "$key")"
            fi
            if (( ${#current} < minimum )); then
              missing+=("$key")
            fi
          }

          missing=()
          ensure_value GITHUB_CLIENT_ID "$SOURCE_GITHUB_CLIENT_ID" 1
          ensure_value GITHUB_CLIENT_SECRET "$SOURCE_GITHUB_CLIENT_SECRET" 1
          ensure_value AGENT_CREDENTIAL_KEY "$SOURCE_AGENT_CREDENTIAL_KEY" 32
          ensure_value SUPABASE_SERVICE_ROLE_KEY "$SOURCE_SUPABASE_SERVICE_ROLE_KEY" 1

          if (( ${#missing[@]} > 0 )); then
            joined="$(IFS=,; echo "${missing[*]}")"
            echo "missing=$joined" >> "$GITHUB_OUTPUT"
            echo "Missing OAuth dependencies: $joined" >&2
            exit 1
          fi
          echo "missing=" >> "$GITHUB_OUTPUT"

      - name: Deploy exact current revision
        id: render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          endpoint="https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys"
          auth=(--header "Authorization: Bearer $RENDER_API_KEY" --header 'Content-Type: application/json')
          body="$(mktemp)"
          http_status="$(curl --silent --show-error --connect-timeout 10 --max-time 60 \
            "${auth[@]}" --output "$body" --write-out '%{http_code}' --request POST \
            --data "$(jq -nc --arg commitId "$GITHUB_SHA" '{commitId:$commitId}')" \
            "$endpoint")"
          response="$(cat "$body")"
          rm -f "$body"

          case "$http_status" in
            200|201|202) ;;
            *)
              echo "Render deploy request failed with HTTP $http_status" >&2
              jq -r '.message // .error // empty' <<<"$response" >&2 || true
              exit 1
              ;;
          esac

          deploy_id="$(jq -r '.id // .deploy.id // empty' <<<"$response" 2>/dev/null || true)"
          if [[ -z "$deploy_id" ]]; then
            for attempt in {1..120}; do
              listing="$(curl --fail-with-body --silent --show-error --retry 4 --retry-all-errors \
                --connect-timeout 10 --max-time 60 "${auth[@]}" "$endpoint?limit=20")"
              deploy_id="$(jq -r --arg commit "$GITHUB_SHA" '
                (if type == "array" then . elif (.deploys | type) == "array" then .deploys else [] end)
                | map(.deploy // .)
                | map(select((.commit.id // .commitId // "") == $commit))
                | first
                | .id // empty
              ' <<<"$listing")"
              [[ -n "$deploy_id" ]] && break
              sleep 5
            done
          fi

          if [[ ! "$deploy_id" =~ ^dep-[a-z0-9]+$ ]]; then
            echo "Queued Render deploy did not expose an id for commit $GITHUB_SHA" >&2
            exit 1
          fi
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Render deployment
        id: wait
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_DEPLOY_ID: ${{ steps.render.outputs.deploy_id }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          for attempt in {1..150}; do
            response="$(curl --fail-with-body --silent --show-error \
              --retry 4 --retry-all-errors --connect-timeout 10 --max-time 60 \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$RENDER_DEPLOY_ID")"
            status="$(jq -er '.status' <<<"$response")"
            commit="$(jq -r '.commit.id // empty' <<<"$response")"
            if [[ -n "$commit" && "$commit" != "$GITHUB_SHA" ]]; then
              echo "Render resolved a different commit: $commit" >&2
              exit 1
            fi
            case "$status" in
              live)
                [[ "$commit" == "$GITHUB_SHA" ]]
                exit 0
                ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "Render deploy failed with status $status" >&2
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Render deploy did not become live before the deadline" >&2
          exit 1

      - name: Confirm production and OAuth liveness
        id: live
        run: |
          for attempt in {1..30}; do
            live="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 10 --max-time 30 "$PRODUCTION_URL/api/live" || true)"
            oauth="$(curl --silent --show-error --output /tmp/oauth-body --write-out '%{http_code}' \
              --connect-timeout 10 --max-time 30 "$PRODUCTION_URL/api/auth/github" || true)"
            if [[ "$live" == "200" && ( "$oauth" == "401" || "$oauth" == "302" ) ]]; then
              exit 0
            fi
            sleep 5
          done
          cat /tmp/oauth-body >&2 || true
          echo "Production or GitHub OAuth did not recover" >&2
          exit 1

      - name: Record recovery result
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          MISSING: ${{ steps.oauth.outputs.missing }}
          OAUTH_OUTCOME: ${{ steps.oauth.outcome }}
          RENDER_OUTCOME: ${{ steps.render.outcome }}
          WAIT_OUTCOME: ${{ steps.wait.outcome }}
          LIVE_OUTCOME: ${{ steps.live.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "$JOB_STATUS" == "success" ]]; then
            state="success"
            description="GitHub OAuth and exact main revision are live"
          else
            state="failure"
            if [[ -n "$MISSING" ]]; then
              description="Missing Render secrets: ${MISSING:0:105}"
            elif [[ "$OAUTH_OUTCOME" != "success" ]]; then
              description="Render configuration or OAuth recovery failed"
            elif [[ "$RENDER_OUTCOME" != "success" ]]; then
              description="Render deploy request failed"
            elif [[ "$WAIT_OUTCOME" != "success" ]]; then
              description="Render build or rollout failed"
            elif [[ "$LIVE_OUTCOME" != "success" ]]; then
              description="Production liveness check failed"
            else
              description="Render recovery failed"
            fi
          fi
          jq -nc --arg state "$state" --arg context "Render Recovery" --arg description "$description" --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --input - >/dev/null
