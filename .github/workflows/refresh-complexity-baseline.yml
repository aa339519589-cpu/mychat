name: Refresh Complexity Baseline

on:
  push:
    branches:
      - feature/openrouter-model-catalog-20260801
    paths:
      - .github/workflows/refresh-complexity-baseline.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feature/openrouter-model-catalog-20260801
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: node scripts/check-function-complexity.mjs --print-baseline > scripts/function-complexity-baseline.json
      - name: Commit refreshed baseline
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/function-complexity-baseline.json
          git commit -m "Refresh function complexity baseline"
          git push origin HEAD:feature/openrouter-model-catalog-20260801
