name: Bootstrap RH75 Maestro task

on:
  push:
    paths:
      - .github/workflows/bootstrap-rh75-maestro.yml

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Create Maestro task
        shell: bash
        run: |
          cat > payload.json <<'JSON'
          {
            "jsonrpc": "2.0",
            "id": 1,
            "method": "tools/call",
            "params": {
              "name": "maestro_create_task",
              "arguments": {
                "objective": "Research the Riemann zeta function and obtain a rigorous unconditional lower bound of at least 75% for the proportion of nontrivial zeros that are both simple and on the critical line, with denominator counting all nontrivial zeros with multiplicity. The target is liminf_{T->infinity} N^s_0(T,2T)/N(T,2T) >= 0.75. Do not redefine or weaken the target. Any result below 75% is only a checkpoint and must not be treated as completion. Do not fabricate a proof or numerical bound. Continue across Maestro worker turns until the stated target has a rigorous unconditional proof, and require the independent review turn to verify every essential analytic inequality and logical step before finish.",
                "maxRounds": 100000
              }
            }
          }
          JSON
          response="$(curl --fail-with-body --silent --show-error \
            -H 'content-type: application/json' \
            --data-binary @payload.json \
            https://mychat-nm6x.onrender.com/api/maestro/mcp)"
          printf '%s\n' "$response" > response.json
          start_code="$(printf '%s' "$response" | jq -r '.result.structuredContent.startCode // empty')"
          if [ -z "$start_code" ]; then
            cat response.json
            exit 1
          fi
          echo "MAESTRO_START_CODE=$start_code"
