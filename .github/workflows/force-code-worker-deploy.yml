name: Force Code Worker Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/force-code-worker-deploy.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: force-code-worker-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PRODUCTION_URL: https://mychat-nm6x.onrender.com
      SUPABASE_URL: https://usibkqqksgwgvdiqwpyo.supabase.co
    steps:
      - name: Mark deployment pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -nc --arg context "Code Worker Deploy" --arg description "Deploying web and Code worker" --arg target_url "$RUN_URL" \
            '{state:"pending",context:$context,description:$description,target_url:$target_url}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --input - >/dev/null

      - name: Configure Render supervisor and runtime role
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          service="https://api.render.com/v1/services/$RENDER_SERVICE_ID"
          env_base="$service/env-vars"
          auth=(-H "Authorization: Bearer $RENDER_API_KEY" -H 'Content-Type: application/json')
          curl --fail-with-body --silent --show-error "${auth[@]}" -X PATCH \
            --data '{"autoDeploy":"no","serviceDetails":{"healthCheckPath":"/api/live","envSpecificDetails":{"startCommand":"npm start"}}}' \
            "$service" >/dev/null
          curl --fail-with-body --silent --show-error "${auth[@]}" -X PUT \
            --data '{"value":"all"}' "$env_base/MYCHAT_RUNTIME_ROLE" >/dev/null
          curl --fail-with-body --silent --show-error "${auth[@]}" -X PUT \
            --data '{"value":"off"}' "$env_base/MYCHAT_MAINTENANCE_MODE" >/dev/null
          configured="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer $RENDER_API_KEY" "$service")"
          actual="$(jq -r '.serviceDetails.envSpecificDetails.startCommand // "missing"' <<<"$configured")"
          test "$actual" = "npm start"

      - name: Deploy exact current revision
        id: render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          endpoint="https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys"
          auth=(-H "Authorization: Bearer $RENDER_API_KEY" -H 'Content-Type: application/json')
          body="$(mktemp)"
          http_status="$(curl --silent --show-error --connect-timeout 10 --max-time 60 \
            "${auth[@]}" --output "$body" --write-out '%{http_code}' -X POST \
            --data "$(jq -nc --arg commitId "$GITHUB_SHA" '{commitId:$commitId}')" "$endpoint")"
          response="$(cat "$body")"
          rm -f "$body"
          case "$http_status" in
            200|201|202|409) ;;
            *)
              echo "Render deploy request failed with HTTP $http_status" >&2
              jq -r '.message // .error // empty' <<<"$response" >&2 || true
              exit 1
              ;;
          esac
          deploy_id="$(jq -r '.id // .deploy.id // empty' <<<"$response" 2>/dev/null || true)"
          if [[ -z "$deploy_id" ]]; then
            for attempt in {1..120}; do
              listing="$(curl --fail-with-body --silent --show-error --retry 4 --retry-all-errors \
                --connect-timeout 10 --max-time 60 "${auth[@]}" "$endpoint?limit=20")"
              deploy_id="$(jq -r --arg commit "$GITHUB_SHA" '
                (if type == "array" then . elif (.deploys | type) == "array" then .deploys else [] end)
                | map(.deploy // .)
                | map(select((.commit.id // .commitId // "") == $commit))
                | first
                | .id // empty
              ' <<<"$listing")"
              [[ -n "$deploy_id" ]] && break
              sleep 5
            done
          fi
          if [[ ! "$deploy_id" =~ ^dep-[a-z0-9]+$ ]]; then
            echo "Render did not expose a deploy id for commit $GITHUB_SHA" >&2
            exit 1
          fi
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Render live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_DEPLOY_ID: ${{ steps.render.outputs.deploy_id }}
        run: |
          set -euo pipefail
          for attempt in {1..150}; do
            response="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$RENDER_DEPLOY_ID")"
            status="$(jq -r '.status' <<<"$response")"
            commit="$(jq -r '.commit.id // .commitId // empty' <<<"$response")"
            case "$status" in
              live) test "$commit" = "$GITHUB_SHA"; exit 0;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated) exit 1;;
            esac
            sleep 10
          done
          exit 1

      - name: Verify web and Code worker heartbeat
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          test "$(curl --silent --show-error -o /dev/null -w '%{http_code}' "$PRODUCTION_URL/api/live")" = "200"
          envs="$(curl --fail-with-body --silent --show-error --retry 4 --retry-all-errors \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars?limit=100")"
          normalized="$(jq -c 'if type == "array" then map(.envVar // .) elif (.envVars | type) == "array" then (.envVars | map(.envVar // .)) else [] end' <<<"$envs")"
          service_role="$(jq -r 'map(select(.key == "SUPABASE_SERVICE_ROLE_KEY"))[0].value // empty' <<<"$normalized")"
          test -n "$service_role"
          auth=(-H "apikey: $service_role" -H "Authorization: Bearer $service_role")
          for attempt in {1..30}; do
            heartbeat="$(curl --silent --show-error --retry 3 --retry-all-errors "${auth[@]}" \
              "$SUPABASE_URL/rest/v1/job_worker_heartbeats?select=revision,queues,draining,heartbeat_at&order=heartbeat_at.desc&limit=1" 2>/dev/null)" || heartbeat='[]'
            revision="$(jq -r '.[0].revision // empty' <<<"$heartbeat" 2>/dev/null || true)"
            queues="$(jq -r '.[0].queues // [] | join(",")' <<<"$heartbeat" 2>/dev/null || true)"
            draining="$(jq -r '.[0].draining // true' <<<"$heartbeat" 2>/dev/null || echo true)"
            heartbeat_at="$(jq -r '.[0].heartbeat_at // empty' <<<"$heartbeat" 2>/dev/null || true)"
            if [[ "$revision" == "${GITHUB_SHA:0:12}" && "$queues" == *agent* && "$draining" == "false" && -n "$heartbeat_at" ]]; then
              echo "CODE_WORKER_HEARTBEAT revision=$revision queues=$queues heartbeat_at=$heartbeat_at"
              exit 0
            fi
            sleep 5
          done
          echo 'Code worker heartbeat did not appear' >&2
          exit 1

      - name: Publish result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "$JOB_STATUS" == "success" ]]; then
            state=success
            description="Render web and Code worker are live on ${GITHUB_SHA:0:12}"
          else
            state=failure
            description="Code worker deploy or heartbeat verification failed"
          fi
          jq -nc --arg state "$state" --arg context "Code Worker Deploy" --arg description "$description" --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --input - >/dev/null
