name: Sync Code Repair Baseline

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-code-repair-baseline.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: main
          fetch-depth: 0

      - name: Use production Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Regenerate exact complexity baseline
        run: npm run complexity:baseline > scripts/function-complexity-baseline.json

      - name: Commit lowered baseline
        run: |
          if git diff --quiet -- scripts/function-complexity-baseline.json; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/function-complexity-baseline.json
          git commit -m "Lower complexity baseline after Code repair"
          git push origin HEAD:main
