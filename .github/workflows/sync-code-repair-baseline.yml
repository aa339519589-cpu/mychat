name: Sync Code Repair Baseline

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-code-repair-baseline.yml

permissions:
  contents: read
  issues: write
  statuses: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: main
          fetch-depth: 0

      - name: Use production Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Generate and publish exact baseline
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          stage=install
          report() {
            curl --silent --show-error --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data "$(jq -nc --arg state "$1" --arg context "$2" --arg description "$3" '{state:$state,context:$context,description:$description}')" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$REVISION" >/dev/null || true
          }
          fail() {
            local code=$?
            trap - ERR
            report failure "Code Baseline: $stage" "Baseline synchronization failed at $stage"
            exit "$code"
          }
          trap fail ERR
          report pending "Code Baseline: running" "Regenerating exact complexity baseline"
          npm ci --ignore-scripts --legacy-peer-deps
          stage=generate
          npm run complexity:baseline > scripts/function-complexity-baseline.json
          stage=publish
          jq -n --rawfile baseline scripts/function-complexity-baseline.json \
            '{body:("CODE_REPAIR_BASELINE_START\n" + $baseline + "\nCODE_REPAIR_BASELINE_END")}' \
            > /tmp/issue.json
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/199" --input /tmp/issue.json >/dev/null
          report success "Code Baseline: published" "Exact baseline published to operations probe"
